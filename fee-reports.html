<!doctype html><html lang="en"><head><meta name="description" content="Saraswati English Medium School: school management portal."><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Fee reports | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">Fee reports</h1><div id="ovk" class="kpis"></div><div id="ov" class="charts"></div><h2 class="noprint">Detailed reports</h2><div class="row noprint"><div><label for="rt">Report</label><select id="rt"><option value="collection">Collection</option><option value="pending">Pending fees</option><option value="overdue">Overdue fees</option><option value="concession">Concessions</option><option value="ledger">Student ledger</option></select></div><div id="gw"><label for="gb">Group collection by</label><select id="gb"><option value="day">Day (daily)</option><option value="month">Month</option><option value="class">Class</option><option value="mode">Payment mode</option><option value="all">No grouping</option></select></div><div><label for="y">Academic year</label><select id="y"></select></div><div><label for="fd">From date</label><input id="fd" type="date"></div><div><label for="td">To date</label><input id="td" type="date"></div><div><label for="k">Class</label><select id="k"></select></div><div><label for="dv">Division</label><select id="dv"></select></div><div><label for="md">Payment mode</label><select id="md"><option value="">All</option><option value="cash">Cash</option><option value="upi">UPI</option><option value="bank_transfer">Bank transfer</option><option value="cheque">Cheque</option><option value="other">Other</option></select></div><div><label for="q">Search student</label><input id="q" type="search" placeholder="Name or admission no"></div></div><div class="row noprint"><button class="btn" id="go">Show report</button><button class="btn ghost" id="ex">Export CSV</button><button class="btn ghost" onclick="window.print()">Print</button></div><div id="sum"></div><div id="list" class="tw"></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script><script src="js/exams.js"></script><script src="js/fees.js"></script><script src="js/charts.js"></script>
<script>
(async()=>{const p=await Auth.require([...ADMIN_ROLES,"accountant"]);Auth.shell(p);const $=id=>document.getElementById(id);

const list=$("list");let cls=[],divs=[],csv=[];
try{const {data,error}=await db.from("classes").select("id,name").order("sort_order");if(error)throw error;cls=data;$("k").innerHTML='<option value="">All classes</option>'+cls.map(c=>`<option value="${c.id}">${U.esc(c.name)}</option>`).join("");await Ex.yearSelect($("y"))}catch(e){U.friendly(e);return U.state(list,"error","Unable to load. Please try again.")}
async function overview(){const k=$("ovk"),ov=$("ov");k.innerHTML="";ov.innerHTML="";
try{const {data:o,error}=await db.rpc("fee_overview",{p_year:$("y").value||null});if(error)throw error;const T=o.totals,net=Number(T.billed)-Number(T.concession),pc=net?Math.round(Number(T.paid)*100/net):0;
const tile=(l,v,sub)=>{const d=document.createElement("div");d.className="card";const a=document.createElement("small");a.textContent=l;const b=document.createElement("b");b.textContent=v;d.append(a,b);if(sub){const x=document.createElement("small");x.textContent=sub;d.appendChild(x)}return d};
const c=tile("Collected",Fee.inr(T.paid),pc+"% of net billed");const m=document.createElement("div");m.className="meter";m.innerHTML='<span style="width:'+pc+'%"></span>';c.appendChild(m);
k.append(tile("Billed",Fee.inr(T.billed),Fee.inr(T.concession)+" concessions"),c,tile("Outstanding",Fee.inr(T.balance)));
const div=()=>ov.appendChild(document.createElement("div")),fm=v=>Fee.inr(v),cf=v=>"₹"+Charts.compact(v);
Charts.series(div(),"Collection by month",o.months.map(x=>({label:x.m,value:Number(x.a)})),{fmt:cf,valueHead:"Collected"});
Charts.bars(div(),"Outstanding by class",o.by_class.map(x=>({label:x.c,value:Number(x.bal),note:"Collected "+Fee.inr(x.paid)+" of "+Fee.inr(x.net)})),{fmt:cf,color:"--c2",labelHead:"Class",valueHead:"Outstanding"});
Charts.split(div(),"Overdue ageing",[{label:"Not yet due",value:Number(o.aging.current),color:"--c3"},{label:"1-30 days",value:Number(o.aging.d1_30),color:"--c5"},{label:"31-60 days",value:Number(o.aging.d31_60),color:"--c2"},{label:"Over 60 days",value:Number(o.aging.d60p),color:"--c4"}],{fmt:fm});
Charts.split(div(),"Payment modes",o.modes.map((x,i)=>({label:x.k.replace("_"," "),value:Number(x.a),color:["--c1","--c2","--c3","--c4","--c5"][i%5]})),{fmt:fm});
if(o.top_due.length)Charts.bars(div(),"Top 10 overdue students",o.top_due.map(x=>({label:x.n,value:Number(x.bal),note:x.adm+" | "+x.cls})),{fmt:cf,color:"--c2",left:120,labelHead:"Student",valueHead:"Overdue"})}
catch(e){U.friendly(e);ov.innerHTML='<div class="state error">Unable to load the overview. Please try again.</div>'}}
async function loadDivs(){const {data,error}=await db.from("divisions").select("id,name,class_id").eq("academic_year_id",$("y").value);if(error){U.friendly(error);return}divs=data;fillDv()}
function fillDv(){$("dv").innerHTML='<option value="">All divisions</option>'+divs.filter(d=>!$("k").value||d.class_id===$("k").value).map(d=>`<option value="${d.id}">${U.esc(d.name)}</option>`).join("")}
const ENR="student_enrollments(academic_year_id,divisions(id,name,class_id,classes(name)),students(admission_no,first_name,last_name))";
function keep(e){if(!e||e.academic_year_id!==$("y").value)return false;const d=e.divisions;if($("k").value&&d.class_id!==$("k").value)return false;if($("dv").value&&d.id!==$("dv").value)return false;
const t=$("q").value.trim().toLowerCase();return !t||(Fee.name(e.students)+" "+e.students.admission_no).toLowerCase().includes(t)}
function show(head,body,totalRow){csv=[head,...body];list.innerHTML=body.length?"<table><thead><tr>"+head.map(h=>`<th>${U.esc(h)}</th>`).join("")+"</tr></thead><tbody>"+body.map(r=>"<tr>"+r.map(v=>`<td>${U.esc(v)}</td>`).join("")+"</tr>").join("")+(totalRow?"<tr>"+totalRow.map(v=>`<th>${U.esc(v)}</th>`).join("")+"</tr>":"")+"</tbody></table>":"";if(!body.length)U.state(list,"empty","No records for these filters.")}
async function run(){list.innerHTML='<div class="state">Loading...</div>';$("sum").innerHTML="";const rt=$("rt").value;
try{if(rt==="collection"){let q=db.from("fee_payments").select("id,amount,payment_date,mode,reference_no,receipt_no,student_fees(fee_types(name),"+ENR+")").order("payment_date").limit(5000);if($("fd").value)q=q.gte("payment_date",$("fd").value);if($("td").value)q=q.lte("payment_date",$("td").value);if($("md").value)q=q.eq("mode",$("md").value);
const {data,error}=await q;if(error)throw error;const d=data.filter(r=>keep(r.student_fees.student_enrollments)),tot=d.reduce((a,r)=>a+Number(r.amount),0),g=$("gb").value;
$("sum").innerHTML=`<div class="card"><b>${Fee.inr(tot)}</b>Total collection (${d.length} payments)${data.length>=5000?" - first 5000 shown":""}</div>`;
if(g==="all")return show(["Receipt","Date","Student","Admission no","Class","Fee","Mode","Reference","Amount"],d.map(r=>{const e=r.student_fees.student_enrollments;return [r.receipt_no,r.payment_date,Fee.name(e.students),e.students.admission_no,e.divisions.classes.name+" - "+e.divisions.name,r.student_fees.fee_types.name,r.mode.replace("_"," "),r.reference_no||"",Number(r.amount).toFixed(2)]}),["","","","","","","","Total",tot.toFixed(2)]);
const key=r=>g==="day"?r.payment_date:g==="month"?r.payment_date.slice(0,7):g==="class"?r.student_fees.student_enrollments.divisions.classes.name:r.mode.replace("_"," "),m=new Map();d.forEach(r=>{const k=key(r),v=m.get(k)||{n:0,a:0};v.n++;v.a+=Number(r.amount);m.set(k,v)});
show([{day:"Date",month:"Month",class:"Class",mode:"Payment mode"}[g],"Payments","Amount"],[...m].map(([k,v])=>[k,v.n,v.a.toFixed(2)]),["Total",d.length,tot.toFixed(2)])}
else{let q=db.from("student_fees").select("id,installment_no,assigned_amount,concession_amount,paid_amount,balance,due_date,status,fee_types(name),"+ENR).order("due_date").limit(5000);
if(rt==="pending")q=q.gt("balance",0);if(rt==="overdue")q=q.gt("balance",0).lt("due_date",Fee.today());if(rt==="concession")q=q.gt("concession_amount",0);if(rt==="ledger"&&!$("q").value.trim())return U.state(list,"empty","Type a student name or admission number to see the ledger.");
if($("fd").value)q=q.gte("due_date",$("fd").value);if($("td").value)q=q.lte("due_date",$("td").value);const {data,error}=await q;if(error)throw error;const d=data.filter(r=>keep(r.student_enrollments)),sm=k=>d.reduce((a,r)=>a+Number(r[k]),0);
$("sum").innerHTML=`<div class="card"><b>${Fee.inr(sm("balance"))}</b>Outstanding in this report (${d.length} fees)${data.length>=5000?" - first 5000 shown":""}</div>`;
show(["Student","Admission no","Class","Fee","Due date","Fee amount","Concession","Paid","Balance","Status"],d.map(r=>{const e=r.student_enrollments;return [Fee.name(e.students),e.students.admission_no,e.divisions.classes.name+" - "+e.divisions.name,r.fee_types.name,r.due_date,Number(r.assigned_amount).toFixed(2),Number(r.concession_amount).toFixed(2),Number(r.paid_amount).toFixed(2),Number(r.balance).toFixed(2),Fee.label(Fee.status(r))]}),["","","","","Total",sm("assigned_amount").toFixed(2),sm("concession_amount").toFixed(2),sm("paid_amount").toFixed(2),sm("balance").toFixed(2),""])}}
catch(e){U.friendly(e);U.state(list,"error","Unable to load the report. Please try again.")}}
$("go").onclick=run;$("k").onchange=fillDv;$("y").onchange=async()=>{await loadDivs();overview()};$("rt").onchange=()=>{$("gw").hidden=$("rt").value!=="collection"};
$("ex").onclick=()=>csv.length?Students.download("fee-report.csv",Students.csv(csv)):U.toast("Show a report first.","err");
await loadDivs();overview();
})();
</script><script src="js/i18n.js"></script></body></html>
