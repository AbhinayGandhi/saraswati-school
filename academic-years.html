<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Academic years | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" aria-label="Sidebar"></aside>
<div><header class="top"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1>Academic years</h1><form id="f" class="row"><div><label for="n">Name (e.g. 2026-27)</label><input id="n" required pattern="\d{4}-\d{2}"></div><div><label for="s">Start date</label><input id="s" type="date" required></div><div><label for="e">End date</label><input id="e" type="date" required></div><button class="btn">Add year</button></form><div id="list" class="tw"><div class="state">Loading...</div></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script>
<script>
(async()=>{const p=await Auth.require(ADMIN_ROLES);Auth.shell(p);const list=document.getElementById("list");

async function load(){try{const {data,error}=await db.from("academic_years").select("*").order("start_date",{ascending:false});if(error)throw error;
if(!data.length)return U.state(list,"empty","No academic years yet. Add the first one above.");
list.innerHTML="<table><thead><tr><th>Year</th><th>Dates</th><th>Status</th><th>Actions</th></tr></thead><tbody>"+data.map(y=>`<tr><td>${U.esc(y.name)}</td><td>${U.esc(y.start_date)} to ${U.esc(y.end_date)}</td><td><span class="badge ${y.is_active?"on":""}">${U.esc(y.status)}</span></td><td>${y.status==="archived"?"":(y.is_active?`<button class="btn sm ghost" data-a="close" data-id="${y.id}">Close year</button>`:`<button class="btn sm" data-a="active" data-id="${y.id}">Set active</button> <button class="btn sm ghost" data-a="archive" data-id="${y.id}">Archive</button>`)}</td></tr>`).join("")+"</tbody></table>";
}catch(e){U.friendly(e);U.state(list,"error","Unable to load academic years. Please try again.")}}
list.addEventListener("click",async ev=>{const b=ev.target.closest("button[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;
const msg={active:"Set this year as the active academic year? The current active year will be closed.",close:"Close this academic year? Records stay available.",archive:"Archive this academic year?"}[a];
if(!await U.confirm(msg))return;b.disabled=true;
try{let r;if(a==="active")r=await db.rpc("set_active_year",{p_id:id});else r=await db.from("academic_years").update({status:a==="close"?"closed":"archived",is_active:false}).eq("id",id);
if(r.error)throw r.error;U.audit("Academic year "+a,"academic_years",id);U.toast("Saved.");load()}catch(e){U.friendly(e);U.toast("Could not save the change. Please try again.","err");b.disabled=false}});
document.getElementById("f").addEventListener("submit",async ev=>{ev.preventDefault();
const row={name:n.value.trim(),start_date:s.value,end_date:e.value};
if(row.end_date<=row.start_date)return U.toast("End date must be after the start date.","err");
const {data,error}=await db.from("academic_years").insert(row).select("id").single();
if(error){U.friendly(error);return U.toast(error.code==="23505"?"This academic year already exists.":"Could not add the year. Check the details.","err")}
U.audit("Academic year created","academic_years",data.id);ev.target.reset();U.toast("Academic year added.");load()});
load();
})();
</script></body></html>
