<!doctype html><html lang="en"><head><meta name="description" content="Saraswati English Medium School: school management portal."><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><style>.rc{background:#fff;color:#16233b;border:2px solid #1d56b3;border-radius:10px;padding:1.2rem;margin:0 0 1.2rem;max-width:820px}.rc .hd{text-align:center;border-bottom:3px double #1d56b3;padding-bottom:.6rem;margin-bottom:.8rem}.rc .hd h2{margin:0;font-size:1.35rem}.rc .hd p{margin:.15rem 0;font-size:.9rem}.rc .ttl{text-align:center;font-weight:700;margin:.4rem 0;letter-spacing:.03em}.rc .info{display:grid;grid-template-columns:1fr 1fr;gap:.2rem .8rem;font-size:.95rem;margin:.6rem 0}.rc table{width:100%;border-collapse:collapse;margin:.6rem 0}.rc th,.rc td{border:1px solid #8aa3c9;padding:.3rem .5rem;text-align:left}.rc thead th{background:#e8f1fd}.rc td.n,.rc th.n{text-align:center}.rc .sum{display:flex;flex-wrap:wrap;gap:.6rem;margin:.6rem 0}.rc .sum div{flex:1;min-width:110px;border:1px solid #8aa3c9;border-radius:8px;padding:.4rem .6rem;text-align:center}.rc .sum b{display:block;font-size:1.25rem}.rc .scale{font-size:.8rem;color:#44506a}.rc .sg{display:flex;justify-content:space-between;gap:1rem;margin-top:2.6rem;text-align:center;font-size:.9rem}.rc .sg span{flex:1;border-top:1px solid #16233b;padding-top:.2rem}@media(max-width:600px){.rc{padding:.7rem}.rc .info{grid-template-columns:1fr}.rc th,.rc td{padding:.25rem .3rem;font-size:.82rem}.rc .sum div{min-width:90px}.rc .sg{font-size:.75rem}}@media print{.rc{border:2px solid #000;border-radius:0;padding:8mm;margin:0;max-width:none;page-break-after:always;color:#000}.rc:last-of-type{page-break-after:auto}.rc thead th{background:#eee!important}.rc .sum div{border-color:#000}.rc th,.rc td{border-color:#000}}</style><title>Report card | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">Report card</h1><div id="out"><div class="state">Loading...</div></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script><script src="js/exams.js"></script>
<script>
(async()=>{const p=await Auth.require([...ADMIN_ROLES,"teacher","class_teacher","parent","student"]);Auth.shell(p);const $=id=>document.getElementById(id);
const out=$("out"),qs=new URLSearchParams(location.search),exId=qs.get("exam"),eid=qs.get("e"),dvId=qs.get("dv");
const canRem=["super_admin","school_admin","principal","teacher","class_teacher"].includes(p.role);
const num=v=>v!==""&&v!=null&&!isNaN(Number(v));
async function school(){const o={address:"",phone:"",email:"",principal:"",principal_title:"Principal",registration:""};try{const {data}=await db.from("school_settings").select("key,value");(data||[]).forEach(r=>{if(r.value&&r.key in o)o[r.key]=r.value})}catch(e){}return o}
try{if(!exId||(!eid&&!dvId))throw new Error("missing");
const [rules,sc,ex]=await Promise.all([Ex.rules(),school(),db.from("exams").select("id,name,status,academic_years(name)").eq("id",exId).single()]);if(ex.error)throw ex.error;
let ens;if(eid){const r=await db.from("student_enrollments").select("id,roll_no,division_id,student_id,students(*),divisions(name,classes(name))").eq("id",eid);if(r.error)throw r.error;ens=r.data}
else{const r=await db.from("student_enrollments").select("id,roll_no,division_id,student_id,students(*),divisions(name,classes(name))").eq("division_id",dvId).eq("status","active").order("roll_no",{nullsFirst:false});if(r.error)throw r.error;ens=r.data}
if(!ens.length)return U.state(out,"empty","No students found.");
const divId=ens[0].division_id;
const {data:subs,error:e1}=await db.from("exam_subjects").select("id,max_marks,passing_marks,subjects(name,sort_order)").eq("exam_id",exId).eq("division_id",divId);if(e1)throw e1;
subs.sort((a,b)=>(a.subjects.sort_order-b.subjects.sort_order)||a.subjects.name.localeCompare(b.subjects.name));
const ids=ens.map(x=>x.id);
const [m,a,rr]=await Promise.all([db.from("marks").select("exam_subject_id,enrollment_id,marks,absent").in("enrollment_id",ids).in("exam_subject_id",subs.map(x=>x.id)),db.from("attendance").select("enrollment_id,status").in("enrollment_id",ids),db.from("report_remarks").select("*").eq("exam_id",exId).in("enrollment_id",ids)]);
if(m.error||a.error||rr.error)throw m.error||a.error||rr.error;
const mk=Object.fromEntries(m.data.map(x=>[x.exam_subject_id+"|"+x.enrollment_id,x])),remBy=Object.fromEntries(rr.data.map(x=>[x.enrollment_id,x]));
const scale=rules.slice().sort((x,y)=>y.min_pct-x.min_pct).map(r=>r.grade+": "+r.min_pct+"%+").join(" | ");
const card=en=>{const s=en.students,r=Ex.calc(subs,mk,en.id,rules),rec=a.data.filter(x=>x.enrollment_id===en.id),c=k=>rec.filter(x=>x.status===k).length,days=rec.length,att=c("present")+c("late")+c("half_day")*0.5,rem=remBy[en.id]||{};
const nm=s.first_name+" "+(s.middle_name?s.middle_name+" ":"")+s.last_name;
return `<div class="rc"><div class="hd"><h2>${U.esc(SCHOOL_NAME)}</h2>${sc.address||sc.phone?`<p>${U.esc([sc.address,sc.phone,sc.email].filter(Boolean).join(" | "))}</p>`:""}${sc.registration?`<p>${U.esc(sc.registration)}</p>`:""}</div>
<div class="ttl">PROGRESS REPORT: ${U.esc(ex.data.name)} (${U.esc(ex.data.academic_years.name)})</div>${ex.data.status==="published"?"":"<p><b>Provisional: results are not published.</b></p>"}
<div class="info"><span><b>Name:</b> ${U.esc(nm)}</span><span><b>Class:</b> ${U.esc(en.divisions.classes.name+" - "+en.divisions.name)}</span><span><b>Admission no:</b> ${U.esc(s.admission_no)}</span><span><b>Roll no:</b> ${U.esc(en.roll_no??"-")}</span><span><b>GR no:</b> ${U.esc(s.gr_no||"-")}</span><span><b>Date of birth:</b> ${U.esc(s.dob)}</span></div>
<table><thead><tr><th>Subject</th><th class="n">Maximum</th><th class="n">Passing</th><th class="n">Obtained</th><th class="n">Grade</th></tr></thead><tbody>${subs.map((x,i)=>{const v=r.cells[i].v;return `<tr><td>${U.esc(x.subjects.name)}</td><td class="n">${x.max_marks}</td><td class="n">${x.passing_marks}</td><td class="n">${U.esc(v)}</td><td class="n">${num(v)&&Number(x.max_marks)>0?U.esc(Ex.grade(rules,100*Number(v)/Number(x.max_marks))):"-"}</td></tr>`}).join("")}<tr><th>Total</th><th class="n">${r.max}</th><th></th><th class="n">${r.tot}</th><th></th></tr></tbody></table>
<div class="sum"><div>Percentage<b>${r.pct}%</b></div><div>Grade<b>${U.esc(r.grade)}</b></div><div>Result<b>${U.esc(r.result)}</b></div><div>Attendance<b>${days?Math.round(att/days*100)+"%":"-"}</b>${days?`<small>${att} of ${days} days</small>`:""}</div></div>
<p><b>Class teacher remarks:</b> ${U.esc(rem.teacher_remark||"")}</p><p><b>Principal remarks:</b> ${U.esc(rem.principal_remark||"")}</p>
<p class="scale">Grading: ${U.esc(scale)}</p><div class="sg"><span>Class teacher</span><span>Parent</span><span>${U.esc(sc.principal_title||"Principal")}${sc.principal?" ("+U.esc(sc.principal)+")":""}</span></div></div>`};
const bar=`<p class="noprint"><button class="btn" onclick="window.print()">Print or save as PDF</button> <a href="javascript:history.back()">Back</a>${ens.length>1?" <span class=\"meta\">"+ens.length+" report cards</span>":""}</p>`;
const rem1=(canRem&&eid)?(rem=>`<form id="rf" class="panel noprint"><h3 style="text-align:left">Remarks</h3><label for="tr">Class teacher remarks</label><textarea id="tr" maxlength="300">${U.esc(rem.teacher_remark||"")}</textarea><label for="pr">Principal remarks</label><textarea id="pr" maxlength="300">${U.esc(rem.principal_remark||"")}</textarea><button class="btn">Save remarks</button></form>`)(remBy[eid]||{}):"";
out.innerHTML=bar+ens.map(card).join("")+rem1;
if(rem1)$("rf").addEventListener("submit",async ev=>{ev.preventDefault();const {error}=await db.from("report_remarks").upsert({exam_id:exId,enrollment_id:eid,teacher_remark:$("tr").value.trim()||null,principal_remark:$("pr").value.trim()||null},{onConflict:"exam_id,enrollment_id"});
if(error){U.friendly(error);return U.toast("Could not save remarks.","err")}U.audit("Report remarks saved","report_remarks",eid);U.toast("Saved. Reload to see it on the card.")})}
catch(e){U.friendly(e);U.state(out,"error","Unable to load this report card. Please try again.")}
})();
</script><script src="js/i18n.js"></script></body></html>
