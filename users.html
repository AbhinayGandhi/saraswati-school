<!doctype html><html lang="en"><head><meta name="description" content="Saraswati English Medium School: school management portal."><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Users and roles | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">Users and roles</h1><form id="nf" class="card noprint" autocomplete="off"><h2>Add a new user</h2>
<div class="row"><div><label for="nn">Full name</label><input id="nn" required maxlength="80"></div><div><label for="ne">Email (used to sign in)</label><input id="ne" type="email" required maxlength="120"></div>
<div><label for="nr">Role</label><select id="nr"></select></div>
<div><label for="np">Temporary password (8 or more characters)</label><input id="np" required minlength="8" maxlength="72"></div></div>
<p><button type="button" class="btn ghost" id="gen">Generate password</button> <button class="btn" id="nb">Create user</button></p>
<div id="made"></div></form>
<p class="muted noprint">The new user can sign in immediately and starts as Active with the role you choose. Tell them their email and temporary password. Existing users: change the role or Active box and press Save, or press Password to set a new one.</p>
<label for="q">Search</label><input id="q" type="search" placeholder="Name"><div id="list" class="tw"></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script><script src="js/exams.js"></script><script src="js/fees.js"></script>
<script>
(async()=>{const p=await Auth.require(["super_admin","school_admin"]);Auth.shell(p);const $=id=>document.getElementById(id);

const ROLES=["super_admin","school_admin","principal","teacher","class_teacher","accountant","librarian","reception","parent","student"],list=$("list");let rows=[];
function draw(){const t=$("q").value.trim().toLowerCase(),v=rows.filter(r=>!t||(r.full_name||"").toLowerCase().includes(t));if(!v.length)return U.state(list,"empty","No users found.");
list.innerHTML="<table><thead><tr><th>Name</th><th>Role</th><th>Active</th><th></th></tr></thead><tbody>"+v.map(r=>`<tr data-id="${r.id}"><td><input class="un" value="${U.esc(r.full_name||"")}" maxlength="80" aria-label="Name"></td><td><select class="ur" aria-label="Role">${ROLES.map(o=>`<option value="${o}"${o===r.role?" selected":""}>${o.replace("_"," ")}</option>`).join("")}</select></td><td><input type="checkbox" class="ua" ${r.is_active?"checked":""} aria-label="Active"></td><td><button class="btn sm">Save</button> <button class="btn sm ghost" data-a="pw">Password</button></td></tr>`).join("")+"</tbody></table>"}
async function load(){try{const {data,error}=await db.from("profiles").select("id,full_name,role,is_active").order("created_at",{ascending:false}).limit(300);if(error)throw error;rows=data;draw()}catch(e){U.friendly(e);U.state(list,"error","Unable to load users. Please try again.")}}
$("q").addEventListener("input",U.debounce(draw));
async function callFn(body){const {data,error}=await db.functions.invoke("admin-users",{body});
if(error){let m="Could not reach the user service. Please try again.";try{const r=error.context;if(r&&r.status===404)m="The user-creation service is not set up yet. Follow SETUP-USERS.md (about 10 minutes, one time).";else if(r&&r.json){const j=await r.json();if(j&&j.message)m=j.message}}catch(_){}throw new Error(m)}
if(data&&data.error)throw new Error(data.message||"Could not do this.");return data}
const gen=()=>{const A="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=crypto.getRandomValues(new Uint32Array(10));return [...r].map(n=>A[n%A.length]).join("")};
$("nr").innerHTML=ROLES.filter(r=>p.role==="super_admin"||!["super_admin","school_admin"].includes(r)).map(o=>`<option value="${o}"${o==="teacher"?" selected":""}>${o.replace("_"," ")}</option>`).join("");
$("gen").onclick=()=>{$("np").value=gen()};
$("nf").addEventListener("submit",async ev=>{ev.preventDefault();const body={action:"create",full_name:$("nn").value.trim(),email:$("ne").value.trim(),role:$("nr").value,password:$("np").value};
$("nb").disabled=true;$("made").innerHTML="";
try{await callFn(body);$("made").innerHTML=`<div class="state" role="status"><b>User created.</b><br>Email: ${U.esc(body.email)}<br>Temporary password: <b>${U.esc(body.password)}</b><br>Role: ${U.esc(body.role.replace("_"," "))}. Share these details privately and ask the person to keep the password safe.</div>`;$("nf").reset();$("nr").value="teacher";U.toast("User created.");load()}
catch(e){U.friendly(e);U.toast(e.message,"err")}$("nb").disabled=false});
list.addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;if(b.dataset.a==="pw"){const pid=b.closest("tr").dataset.id,pw=window.prompt("Type a new password for this user (8 or more characters):");if(!pw)return;if(pw.length<8)return U.toast("Password must be at least 8 characters.","err");
try{await callFn({action:"set_password",user_id:pid,password:pw});U.toast("Password changed. Tell the user.")}catch(e){U.friendly(e);U.toast(e.message,"err")}return}
const tr=b.closest("tr"),id=tr.dataset.id,role=tr.querySelector(".ur").value,act=tr.querySelector(".ua").checked;
if(id===p.id&&(role!==p.role||!act))return U.toast("You cannot change your own role or deactivate yourself.","err");
if(!await U.confirm("Save changes for this user?"))return;
const {error}=await db.from("profiles").update({full_name:tr.querySelector(".un").value.trim()||null,role,is_active:act}).eq("id",id);
if(error){U.friendly(error);return U.toast("Could not save. Only a Super Admin can give Admin roles.","err")}U.audit("User role or status changed","profiles",id);U.toast("Saved.");load()});load();
})();
</script></body></html>
