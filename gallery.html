<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><meta name="description" content="Photo gallery of Saraswati English Medium School."><title>Gallery | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><a href="index.html" id="home" hidden>Home</a><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1>Gallery</h1>
<form id="uf" class="panel row" hidden><h3 style="grid-column:1/-1">Upload photos (shrunk automatically, JPG/PNG/WebP)</h3><div><label for="ua">Album</label><select id="ua" required></select></div><div><label for="ut">Title (optional)</label><input id="ut" maxlength="120"></div><div><label for="ux">Description (optional)</label><input id="ux" maxlength="300"></div><div><label for="uv">Who can see it</label><select id="uv"><option value="public">Public website (after approval)</option><option value="school">Logged-in users only</option></select></div><div><label for="ud">Date taken</label><input id="ud" type="date"></div><div><label for="uf">Photos</label><input id="uf2" type="file" accept="image/jpeg,image/png,image/webp" multiple required></div><button class="btn" id="ub">Upload</button><p id="up" style="grid-column:1/-1"></p></form>
<form id="af" class="panel row" hidden><div><label for="an">New album name</label><input id="an" required maxlength="60"></div><button class="btn">Create album</button></form>
<div class="row"><div><label for="fa">Album</label><select id="fa"></select></div><div id="sw" hidden><label for="fs">Status</label><select id="fs"><option value="">All</option><option value="pending">Pending approval</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></div></div>
<div id="list" class="grid"></div><div class="pager"><button class="btn ghost sm" id="pv">Previous</button><span id="pg"></span><button class="btn ghost sm" id="nx">Next</button></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script><script src="js/exams.js"></script><script src="js/fees.js"></script><script src="js/gallery.js"></script>
<script>
(async()=>{const $=id=>document.getElementById(id),p=await Auth.profile();
if(p)Auth.shell(p);else{$("sidebar").remove();document.querySelector(".app").style.gridTemplateColumns="1fr";$("menu").remove();$("who").remove();$("home").hidden=false;$("logout").outerHTML='<a class="btn" href="login.html" style="margin-left:auto">Login</a>'}
const list=$("list"),canUp=!!p&&["super_admin","school_admin","principal","reception","teacher","class_teacher"].includes(p.role),canAp=!!p&&Perm.isAdmin(p.role),PS=24;let page=0,rows=[],albums=[];
$("uf").hidden=!canUp;$("af").hidden=!canAp;$("sw").hidden=!canAp;
async function loadAlbums(){const {data,error}=await db.from("gallery_albums").select("id,name").eq("is_active",true).order("sort_order").order("name");if(error)throw error;albums=data;
$("fa").innerHTML='<option value="">All albums</option>'+data.map(a=>`<option value="${a.id}">${U.esc(a.name)}</option>`).join("");$("ua").innerHTML=data.map(a=>`<option value="${a.id}">${U.esc(a.name)}</option>`).join("")}
async function load(){list.innerHTML='<div class="state">Loading...</div>';try{let q=db.from("gallery_images").select("id,title,description,storage_path,visibility,approval_status,is_active,gallery_albums(name)",{count:"exact"});
if($("fa").value)q=q.eq("album_id",$("fa").value);if(!canAp)q=q.eq("is_active",true);if(canAp&&$("fs").value)q=q.eq("approval_status",$("fs").value);
const {data,error,count}=await q.order("created_at",{ascending:false}).range(page*PS,page*PS+PS-1);if(error)throw error;rows=data;$("pg").textContent=count?`${page*PS+1}-${Math.min(count,(page+1)*PS)} of ${count}`:"0";$("pv").disabled=page===0;$("nx").disabled=(page+1)*PS>=count;
if(!data.length)return U.state(list,"empty","No photos to show yet.");const urls=await Gal.urls(data.map(x=>x.storage_path));
list.innerHTML=data.map(x=>`<div class="card"><a href="${U.esc(urls[x.storage_path]||"#")}" target="_blank" rel="noopener"><img loading="lazy" src="${U.esc(urls[x.storage_path]||"")}" alt="${U.esc(x.title)}" style="width:100%;height:180px;object-fit:cover;border-radius:6px"></a><p><b>${U.esc(x.title)}</b><br><small>${U.esc(x.gallery_albums.name)}</small>${p?` <span class="badge ${x.approval_status==="approved"?"on":""}">${U.esc(x.approval_status)}</span> <span class="badge">${x.visibility==="public"?"public":"logged-in"}</span>${x.is_active?"":' <span class="badge">inactive</span>'}`:""}</p>${canAp?`${x.approval_status!=="approved"?`<button class="btn sm" data-a="${x.id}">Approve</button> `:""}${x.approval_status==="pending"?`<button class="btn sm ghost" data-x="${x.id}">Reject</button> `:""}<button class="btn sm ghost" data-n="${x.id}">Rename</button> <button class="btn sm ghost" data-t="${x.id}">${x.is_active?"Deactivate":"Activate"}</button>`:""}</div>`).join("")}
catch(e){U.friendly(e);U.state(list,"error","Unable to load the gallery. Please try again.")}}
list.addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;const id=b.dataset.a||b.dataset.x||b.dataset.n||b.dataset.t,x=rows.find(r=>r.id===id);if(!x)return;let patch;
if(b.dataset.a)patch={approval_status:"approved"};else if(b.dataset.x)patch={approval_status:"rejected"};else if(b.dataset.t)patch={is_active:!x.is_active};
else{const t=prompt("New title",x.title);if(!t||!t.trim())return;patch={title:t.trim().slice(0,120)}}
const {error}=await db.from("gallery_images").update(patch).eq("id",id);if(error){U.friendly(error);return U.toast("Could not save the change.","err")}U.audit("Gallery image updated","gallery_images",id);load()});
$("af").addEventListener("submit",async ev=>{ev.preventDefault();const {error}=await db.from("gallery_albums").insert({name:$("an").value.trim()});if(error){U.friendly(error);return U.toast(error.code==="23505"?"This album already exists.":"Could not create the album.","err")}U.toast("Album created.");ev.target.reset();await loadAlbums();load()});
$("uf").addEventListener("submit",async ev=>{ev.preventDefault();const files=[...$("uf2").files];if(!files.length)return;if(files.some(f=>f.size>15728640||!["image/jpeg","image/png","image/webp"].includes(f.type)))return U.toast("Use JPG, PNG or WebP photos up to 15 MB each.","err");
$("ub").disabled=true;let ok=0,bad=0;for(let i=0;i<files.length;i++){$("up").textContent=`Uploading ${i+1} of ${files.length}...`;try{const blob=await Gal.resize(files[i]),path=`${$("ua").value}/${crypto.randomUUID()}.jpg`;
const {error:ue}=await db.storage.from("gallery").upload(path,blob,{contentType:"image/jpeg",upsert:false});if(ue)throw ue;
const {error}=await db.from("gallery_images").insert({album_id:$("ua").value,title:($("ut").value.trim()||files[i].name.replace(/\.[^.]+$/,"")).slice(0,120),description:$("ux").value.trim()||null,storage_path:path,visibility:$("uv").value,taken_on:$("ud").value||null,approval_status:canAp?"approved":"pending"});if(error)throw error;ok++}catch(e){console.error(e);bad++}}
$("ub").disabled=false;$("up").textContent="";U.toast(`Uploaded ${ok} photo(s).`+(bad?` ${bad} failed.`:"")+(!canAp&&ok?" An admin will review them.":""),bad?"err":"ok");ev.target.reset();load()});
$("fa").onchange=()=>{page=0;load()};$("fs").onchange=()=>{page=0;load()};$("pv").onclick=()=>{page--;load()};$("nx").onclick=()=>{page++;load()};
try{await loadAlbums();load()}catch(e){U.friendly(e);U.state(list,"error","Unable to load the gallery. Please try again.")}
})();
</script></body></html>
