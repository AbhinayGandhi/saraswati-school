<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Fee structure | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">Fee structure</h1><div class="row"><div><label for="y">Academic year</label><select id="y"></select></div></div><form id="f" class="row"><div><label for="k">Class</label><select id="k"></select></div><div><label for="dv">Division (optional)</label><select id="dv"></select></div><div><label for="ft">Fee type</label><select id="ft"></select></div><div><label for="am">Amount per installment</label><input id="am" type="number" min="0" step="0.01" required></div><div><label for="fr">Frequency</label><select id="fr"><option value="monthly">Monthly (12)</option><option value="quarterly">Quarterly (4)</option><option value="half_yearly">Half-yearly (2)</option><option value="annual">Annual (1)</option><option value="one_time">One-time (1)</option></select></div><div><label for="du">First due date</label><input id="du" type="date" required></div><div><label for="nt">Notes</label><input id="nt" maxlength="200"></div><button class="btn">Add fee</button></form><div id="list" class="tw"></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script><script src="js/exams.js"></script><script src="js/fees.js"></script>
<script>
(async()=>{const p=await Auth.require([...ADMIN_ROLES,"accountant"]);Auth.shell(p);const $=id=>document.getElementById(id);

const list=$("list"),canEdit=Fee.MANAGE.includes(p.role);let cls=[],divs=[],rows=[];$("f").hidden=!canEdit;
try{const [c,t]=await Promise.all([db.from("classes").select("id,name").order("sort_order"),db.from("fee_types").select("id,name").eq("is_active",true).order("name")]);if(c.error||t.error)throw c.error||t.error;cls=c.data;
$("k").innerHTML=cls.map(a=>`<option value="${a.id}">${U.esc(a.name)}</option>`).join("");$("ft").innerHTML=t.data.map(a=>`<option value="${a.id}">${U.esc(a.name)}</option>`).join("");await Ex.yearSelect($("y"))}catch(e){U.friendly(e);return U.state(list,"error","Unable to load. Please try again.")}
async function loadDivs(){const {data,error}=await db.from("divisions").select("id,name,class_id").eq("academic_year_id",$("y").value);if(error){U.friendly(error);return}divs=data;fillDv()}
function fillDv(){$("dv").innerHTML='<option value="">All divisions of the class</option>'+divs.filter(d=>d.class_id===$("k").value).map(d=>`<option value="${d.id}">${U.esc(d.name)}</option>`).join("")}
async function load(){try{const {data,error}=await db.from("fee_structures").select("*,classes(name,sort_order),divisions(name),fee_types(name)").eq("academic_year_id",$("y").value);if(error)throw error;rows=data.sort((a,b)=>a.classes.sort_order-b.classes.sort_order);
if(!rows.length)return U.state(list,"empty","No fees defined for this year yet.");
list.innerHTML="<table><thead><tr><th>Class</th><th>Fee</th><th>Amount</th><th>Frequency</th><th>First due</th><th>Notes</th><th></th></tr></thead><tbody>"+rows.map(x=>`<tr><td>${U.esc(x.classes.name+(x.divisions?" - "+x.divisions.name:""))}</td><td>${U.esc(x.fee_types.name)}</td><td>${Fee.inr(x.amount)}</td><td>${U.esc(Fee.label(x.frequency))}</td><td>${U.esc(x.due_date)}</td><td>${U.esc(x.notes||"")}</td><td>${canEdit?`<button class="btn sm" data-id="${x.id}">Assign to students</button>`:""}</td></tr>`).join("")+"</tbody></table>"}catch(e){U.friendly(e);U.state(list,"error","Unable to load fees. Please try again.")}}
list.addEventListener("click",async ev=>{const b=ev.target.closest("button[data-id]");if(!b)return;const s=rows.find(x=>x.id===b.dataset.id);
const n={monthly:12,quarterly:4,half_yearly:2,annual:1,one_time:1}[s.frequency],step={monthly:1,quarterly:3,half_yearly:6,annual:12,one_time:12}[s.frequency];
try{const ids=divs.filter(d=>d.class_id===s.class_id&&(!s.division_id||d.id===s.division_id)).map(d=>d.id);if(!ids.length)return U.toast("No divisions found for this class in this year.","err");
const {data:en,error}=await db.from("student_enrollments").select("id").eq("academic_year_id",s.academic_year_id).eq("status","active").in("division_id",ids);if(error)throw error;if(!en.length)return U.toast("No active students to assign.","err");
if(!await U.confirm(`Assign ${s.fee_types.name} (${n} installment${n>1?"s":""} of ${Fee.inr(s.amount)}) to ${en.length} students? Students who already have it are skipped.`))return;b.disabled=true;
const all=[];en.forEach(e=>{for(let i=1;i<=n;i++)all.push({enrollment_id:e.id,fee_structure_id:s.id,fee_type_id:s.fee_type_id,installment_no:i,assigned_amount:s.amount,due_date:Fee.addMonths(s.due_date,(i-1)*step)})});
for(let i=0;i<all.length;i+=500){const {error:e2}=await db.from("student_fees").upsert(all.slice(i,i+500),{onConflict:"enrollment_id,fee_structure_id,installment_no",ignoreDuplicates:true});if(e2)throw e2}
U.audit("Fee assigned to "+en.length+" students","student_fees",s.id);U.toast("Fee assigned.")}catch(e){U.friendly(e);U.toast("Could not assign the fee. Please try again.","err")}b.disabled=false});
$("k").onchange=fillDv;$("y").onchange=async()=>{await loadDivs();load()};
$("f").addEventListener("submit",async ev=>{ev.preventDefault();const {data,error}=await db.from("fee_structures").insert({academic_year_id:$("y").value,class_id:$("k").value,division_id:$("dv").value||null,fee_type_id:$("ft").value,amount:Number($("am").value),frequency:$("fr").value,due_date:$("du").value,notes:$("nt").value.trim()||null}).select("id").single();
if(error){U.friendly(error);return U.toast(error.code==="23505"?"This fee is already defined for this class.":"Could not add the fee.","err")}U.audit("Fee structure created","fee_structures",data.id);ev.target.reset();U.toast("Added.");load()});
await loadDivs();load();
})();
</script></body></html>
