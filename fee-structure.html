<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Fee structure | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">Fee structure</h1><p>Set the <b>total fee per student for the year</b>. Parents can pay any amount at any time; payments simply reduce the balance. Only one fee of each type is allowed per class and year.</p><div class="row"><div><label for="y">Academic year</label><select id="y"></select></div></div><form id="f" class="row"><div><label for="k">Class</label><select id="k"></select></div><div><label for="dv">Division (optional)</label><select id="dv"></select></div><div><label for="ft">Fee type</label><select id="ft"></select></div><div><label for="am">Total fee per student (year)</label><input id="am" type="number" min="0" step="0.01" required></div><div><label for="du">Last date to pay</label><input id="du" type="date" required></div><div><label for="nt">Notes</label><input id="nt" maxlength="200"></div><button class="btn">Add fee</button></form><div id="list" class="tw"></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script><script src="js/exams.js"></script><script src="js/fees.js"></script>
<script>
(async()=>{const p=await Auth.require([...ADMIN_ROLES,"accountant"]);Auth.shell(p);const $=id=>document.getElementById(id);

const list=$("list"),canEdit=Fee.MANAGE.includes(p.role);let cls=[],divs=[],rows=[];$("f").hidden=!canEdit;
try{const [c,t]=await Promise.all([db.from("classes").select("id,name").order("sort_order"),db.from("fee_types").select("id,name").eq("is_active",true).order("name")]);if(c.error||t.error)throw c.error||t.error;cls=c.data;
$("k").innerHTML=cls.map(a=>`<option value="${a.id}">${U.esc(a.name)}</option>`).join("");$("ft").innerHTML=t.data.map(a=>`<option value="${a.id}">${U.esc(a.name)}</option>`).join("");await Ex.yearSelect($("y"))}catch(e){U.friendly(e);return U.state(list,"error","Unable to load. Please try again.")}
async function loadDivs(){const {data,error}=await db.from("divisions").select("id,name,class_id").eq("academic_year_id",$("y").value);if(error){U.friendly(error);return}divs=data;fillDv()}
function fillDv(){$("dv").innerHTML='<option value="">All divisions of the class</option>'+divs.filter(d=>d.class_id===$("k").value).map(d=>`<option value="${d.id}">${U.esc(d.name)}</option>`).join("")}
async function load(){try{const {data,error}=await db.from("fee_structures").select("*,classes(name,sort_order),divisions(name),fee_types(name)").eq("academic_year_id",$("y").value);if(error)throw error;rows=data.sort((a,b)=>a.classes.sort_order-b.classes.sort_order);
if(!rows.length)return U.state(list,"empty","No fees defined for this year yet.");
list.innerHTML="<table><thead><tr><th>Class</th><th>Fee</th><th>Total per student</th><th>Last date to pay</th><th>Notes</th><th></th></tr></thead><tbody>"+rows.map(x=>`<tr><td>${U.esc(x.classes.name+(x.divisions?" - "+x.divisions.name:""))}</td><td>${U.esc(x.fee_types.name)}</td><td>${Fee.inr(x.amount)}</td><td>${U.esc(x.due_date)}</td><td>${U.esc(x.notes||"")}</td><td>${canEdit?`<button class="btn sm" data-id="${x.id}">Assign to students</button> <button class="btn sm ghost" data-rm="${x.id}">Remove unpaid</button>`:""}</td></tr>`).join("")+"</tbody></table>"}catch(e){U.friendly(e);U.state(list,"error","Unable to load fees. Please try again.")}}
list.addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;
if(b.dataset.id){const s=rows.find(x=>x.id===b.dataset.id);if(!await U.confirm(`Assign "${s.fee_types.name}" (${Fee.inr(s.amount)} per student) to all active students of ${s.classes.name}${s.divisions?" - "+s.divisions.name:""}? Students who already have this fee are skipped.`))return;b.disabled=true;
const {data,error}=await db.rpc("assign_fee_structure",{p_id:s.id});b.disabled=false;if(error){U.friendly(error);return U.toast("Could not assign the fee. Please try again.","err")}const [n,t]=String(data).split(",");
U.audit("Fee assigned to "+n+" students","student_fees",s.id);U.toast(`Assigned to ${n} of ${t} students.`+(Number(t)-Number(n)>0?` ${Number(t)-Number(n)} already had this fee.`:""))}
else if(b.dataset.rm){const s=rows.find(x=>x.id===b.dataset.rm);
try{const [a,k]=await Promise.all([db.from("student_fees").select("id",{count:"exact",head:true}).eq("fee_structure_id",s.id),db.from("student_fees").select("id",{count:"exact",head:true}).eq("fee_structure_id",s.id).or("paid_amount.gt.0,concession_amount.gt.0")]);if(a.error||k.error)throw a.error||k.error;
const keep=k.count||0,del=(a.count||0)-keep;
if(!await U.confirm(`Remove "${s.fee_types.name}" (${s.classes.name})? ${del} unpaid student fees will be deleted. ${keep} that already have payments or concessions will stay.${keep===0?" The fee itself will also be removed.":""}`))return;
const {data,error}=await db.rpc("remove_fee_structure",{p_id:s.id});if(error)throw error;const [r,kp]=String(data).split(",");U.audit("Fee structure removed ("+r+" unpaid)","fee_structures",s.id);U.toast(`Removed ${r} unpaid fees.`+(Number(kp)>0?` ${kp} with payments were kept.`:""));load()}
catch(e){U.friendly(e);U.toast("Could not remove the fee. Please try again.","err")}}});
$("k").onchange=fillDv;$("y").onchange=async()=>{await loadDivs();load()};
$("f").addEventListener("submit",async ev=>{ev.preventDefault();const {data,error}=await db.from("fee_structures").insert({academic_year_id:$("y").value,class_id:$("k").value,division_id:$("dv").value||null,fee_type_id:$("ft").value,amount:Number($("am").value),due_date:$("du").value,notes:$("nt").value.trim()||null}).select("id").single();
if(error){U.friendly(error);return U.toast(String(error.message).includes("duplicate")||error.code==="23505"?"This fee type already exists for this class in this year. Remove the wrong one first.":"Could not add the fee.","err")}U.audit("Fee structure created","fee_structures",data.id);ev.target.reset();U.toast("Added. Now press Assign to students.");load()});
await loadDivs();load();
})();
</script></body></html>
