<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Link logins to employees | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">Link logins to employees</h1><p>Connect each teacher or staff member to their login. This lets teachers see their own leave and attendance and lets the system know which classes they teach. Create the login in Supabase first and set the role in Users and roles.</p><div id="list" class="tw"></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script><script src="js/exams.js"></script><script src="js/fees.js"></script>
<script>
(async()=>{const p=await Auth.require(ADMIN_ROLES);Auth.shell(p);const $=id=>document.getElementById(id);

const list=$("list");let users=[];
async function load(){try{const [u,t,s]=await Promise.all([db.from("profiles").select("id,full_name,role").eq("is_active",true).order("full_name"),db.from("teachers").select("id,name,employee_id,profile_id").order("name"),db.from("staff").select("id,name,employee_id,profile_id").order("name")]);if(u.error||t.error||s.error)throw u.error||t.error||s.error;users=u.data;
const row=(kind,x)=>`<tr data-k="${kind}" data-id="${x.id}"><td>${kind==="t"?"Teacher":"Staff"}</td><td>${U.esc(x.employee_id)}</td><td>${U.esc(x.name)}</td><td><select><option value="">Not linked</option>${users.map(a=>`<option value="${a.id}"${a.id===x.profile_id?" selected":""}>${U.esc((a.full_name||"User")+" ("+a.role.replace("_"," ")+")")}</option>`).join("")}</select></td><td><button class="btn sm">Save</button></td></tr>`;
list.innerHTML=t.data.length+s.data.length?"<table><thead><tr><th>Kind</th><th>ID</th><th>Name</th><th>Login</th><th></th></tr></thead><tbody>"+t.data.map(x=>row("t",x)).join("")+s.data.map(x=>row("s",x)).join("")+"</tbody></table>":"<div class=\"state\">Add teachers and staff first.</div>"}catch(e){U.friendly(e);U.state(list,"error","Unable to load. Please try again.")}}
list.addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;const tr=b.closest("tr"),v=tr.querySelector("select").value||null;
const {error}=await db.from(tr.dataset.k==="t"?"teachers":"staff").update({profile_id:v}).eq("id",tr.dataset.id);if(error){U.friendly(error);return U.toast(error.code==="23505"?"This login is already linked to another employee.":"Could not save.","err")}
U.audit("Login linked to employee",tr.dataset.k==="t"?"teachers":"staff",tr.dataset.id);U.toast("Saved.");load()});load();
})();
</script></body></html>
