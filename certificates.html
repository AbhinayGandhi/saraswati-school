<!doctype html><html lang="en"><head><meta name="description" content="Saraswati English Medium School: school management portal."><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Certificates | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">Certificates</h1>
<div class="noprint"><div class="row"><div><label for="q">Find student (name or admission no)</label><input id="q" type="search" placeholder="Type at least 2 letters"></div><div><label for="ty">Certificate</label><select id="ty"><option value="bonafide">Bonafide certificate</option><option value="transfer">Transfer certificate (TC)</option><option value="character">Character certificate</option></select></div></div>
<div id="res"></div>
<form id="f" class="panel" hidden><h3 id="who2"></h3><div class="row" id="flds"></div><button class="btn" id="ib">Issue and print</button> <small>A certificate number is given when you issue. The register below keeps every issued certificate.</small></form></div>
<div id="cert"></div>
<div class="noprint"><h2>Issued certificates</h2><div id="reg" class="tw"><div class="state">Loading...</div></div></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/fees.js"></script>
<script>

(async()=>{const p=await Auth.require([...ADMIN_ROLES,"reception"]);Auth.shell(p);const $=id=>document.getElementById(id);let sel=null,school="Saraswati English Medium School";
const nm=s=>[s.first_name,s.middle_name,s.last_name].filter(Boolean).join(" ");
const FLD={bonafide:[["purpose","Purpose (for example: bank account, passport)"]],
transfer:[["leaving_date","Date of leaving","date"],["last_class","Class last studied"],["reason","Reason for leaving"],["conduct","Conduct (for example: Good)"],["dues","Dues cleared? (Yes / No)"],["remarks","Remarks"]],
character:[["conduct","Conduct and character (for example: Good)"],["remarks","Remarks"]]};
const NAME={bonafide:"Bonafide certificate",transfer:"Transfer certificate",character:"Character certificate"};
function flds(){const t=$("ty").value;$("flds").innerHTML=FLD[t].map(([k,l,ty])=>`<div><label for="d_${k}">${U.esc(l)}</label><input id="d_${k}" type="${ty||"text"}" maxlength="200"></div>`).join("")}
$("ty").onchange=flds;flds();
async function info(sid){const [e,g]=await Promise.all([db.from("student_enrollments").select("divisions(name,classes(name)),academic_years(name)").eq("student_id",sid).order("created_at",{ascending:false}).limit(1),db.from("student_guardians").select("relation,name").eq("student_id",sid)]);if(e.error)throw e.error;if(g.error)throw g.error;
const f=(g.data||[]).find(x=>x.relation==="father")||(g.data||[])[0]||{};const en=(e.data||[])[0];return {cls:en?en.divisions.classes.name+" - "+en.divisions.name:"[class]",year:en?en.academic_years.name:"[year]",parent:f.name||"[parent name]"}}
async function show(c,s){const i=await info(s.id),d=c.details||{},rel=s.gender==="Male"?"son":s.gender==="Female"?"daughter":"child",pr=s.gender==="Male"?"his":s.gender==="Female"?"her":"their",he=s.gender==="Male"?"He":s.gender==="Female"?"She":"The student";
let body="";const who=`<b>${U.esc(nm(s))}</b>, ${rel} of <b>${U.esc(i.parent)}</b>, Admission no. ${U.esc(s.admission_no)}${s.gr_no?" (GR no. "+U.esc(s.gr_no)+")":""}`;
if(c.cert_type==="bonafide")body=`<p>This is to certify that ${who}, is a bonafide student of this school, studying in <b>${U.esc(i.cls)}</b> in the academic year ${U.esc(i.year)}. ${pr[0].toUpperCase()+pr.slice(1)} date of birth as per school records is ${U.esc(s.dob||"[date of birth]")}.</p>${d.purpose?`<p>This certificate is issued for: ${U.esc(d.purpose)}.</p>`:""}`;
else if(c.cert_type==="transfer")body=`<p>This is to certify that ${who}, was admitted to this school on ${U.esc(s.admission_date||"[date]")}. Date of birth as per school records: ${U.esc(s.dob||"[date of birth]")}.</p><table><tbody><tr><th>Class last studied</th><td>${U.esc(d.last_class||i.cls)}</td></tr><tr><th>Date of leaving</th><td>${U.esc(d.leaving_date||"")}</td></tr><tr><th>Reason for leaving</th><td>${U.esc(d.reason||"")}</td></tr><tr><th>Conduct</th><td>${U.esc(d.conduct||"")}</td></tr><tr><th>School dues cleared</th><td>${U.esc(d.dues||"")}</td></tr><tr><th>Remarks</th><td>${U.esc(d.remarks||"")}</td></tr></tbody></table>`;
else body=`<p>This is to certify that ${who}, studied in this school and is in <b>${U.esc(i.cls)}</b> (academic year ${U.esc(i.year)}). ${he} bears a character and conduct that is <b>${U.esc(d.conduct||"[to be entered]")}</b>.</p>${d.remarks?`<p>${U.esc(d.remarks)}</p>`:""}`;
$("cert").innerHTML=`<p class="noprint"><button class="btn" onclick="window.print()">Print or save as PDF</button></p><div class="rc">${await U.letterhead(NAME[c.cert_type],"")}<p style="display:flex;justify-content:space-between"><span>No: <b>${U.esc(c.cert_no)}</b></span><span>Date: ${U.esc(c.issued_date)}</span></p>${body}<p style="margin-top:3.5rem;display:flex;justify-content:space-between"><span>Date: ${U.esc(c.issued_date)}</span><span>Principal<br><small>[Principal Name]</small></span></p><p><small>School seal</small></p></div>`;$("cert").scrollIntoView()}
let tm;$("q").oninput=()=>{clearTimeout(tm);tm=setTimeout(async()=>{const v=$("q").value.trim();$("res").innerHTML="";$("f").hidden=true;sel=null;if(v.length<2)return;
try{const e=v.replace(/[%,()]/g," ");const {data,error}=await db.from("students").select("id,admission_no,gr_no,first_name,middle_name,last_name,gender,dob,admission_date").or(`first_name.ilike.%${e}%,last_name.ilike.%${e}%,admission_no.ilike.%${e}%`).order("first_name").limit(10);if(error)throw error;
$("res").innerHTML=data.length?data.map((s,i)=>`<button class="btn ghost sm" data-i="${i}" style="margin:.2rem">${U.esc(nm(s)+" ("+s.admission_no+")")}</button>`).join(""):'<div class="state">No student found.</div>';$("res")._d=data}catch(e){U.friendly(e);U.state($("res"),"error","Search failed. Please try again.")}},300)};
$("res").onclick=ev=>{const b=ev.target.closest("[data-i]");if(!b)return;sel=$("res")._d[b.dataset.i];$("who2").textContent=nm(sel)+" ("+sel.admission_no+")";$("f").hidden=false};
$("f").onsubmit=async ev=>{ev.preventDefault();if(!sel)return;const t=$("ty").value,det={};FLD[t].forEach(([k])=>{const v=$("d_"+k).value.trim();if(v)det[k]=v});
if(t==="transfer"&&!(await U.confirm("Issue a Transfer Certificate for "+nm(sel)+"? A number is given and it is saved in the register.")))return;$("ib").disabled=true;
try{const {data,error}=await db.rpc("issue_certificate",{p_student:sel.id,p_type:t,p_details:det});if(error)throw error;await show(data,sel);U.toast("Issued "+data.cert_no);loadReg()}catch(e){U.friendly(e);U.toast("Could not issue the certificate.","err")}$("ib").disabled=false};
let reg=[];async function loadReg(){try{const {data,error}=await db.from("certificates_issued").select("id,cert_no,cert_type,issued_date,details,students(id,admission_no,gr_no,first_name,middle_name,last_name,gender,dob,admission_date)").order("created_at",{ascending:false}).limit(100);if(error)throw error;reg=data;
$("reg").innerHTML=data.length?`<table><thead><tr><th>No</th><th>Type</th><th>Student</th><th>Date</th><th></th></tr></thead><tbody>${data.map((c,i)=>`<tr><td>${U.esc(c.cert_no)}</td><td>${U.esc(NAME[c.cert_type])}</td><td>${U.esc(nm(c.students))}</td><td>${U.esc(c.issued_date)}</td><td><button class="btn sm ghost" data-r="${i}">Reprint</button></td></tr>`).join("")}</tbody></table>`:'<div class="state">No certificate issued yet.</div>'}catch(e){U.friendly(e);U.state($("reg"),"error","Unable to load the register.")}}
$("reg").onclick=async ev=>{const b=ev.target.closest("[data-r]");if(!b)return;const c=reg[b.dataset.r];try{await show(c,c.students)}catch(e){U.friendly(e);U.toast("Could not open it.","err")}};
try{const s=await U.settings();school=s.school_name||school}catch(e){}loadReg();
})();
</script></body></html>
