<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Library | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">Library</h1><div class="row noprint"><button class="btn" data-t="books">Books</button><button class="btn ghost" data-t="issue">Issue a book</button><button class="btn ghost" data-t="tx">Issued, overdue and returned</button></div>
<section id="books"><form id="bf" class="panel row" hidden><h3 id="bt" style="grid-column:1/-1">Add book</h3><div><label for="bc">Book ID</label><input id="bc" required maxlength="30"></div><div><label for="bi">ISBN</label><input id="bi" maxlength="20"></div><div><label for="bn">Title</label><input id="bn" required maxlength="200"></div><div><label for="ba">Author</label><input id="ba" maxlength="120"></div><div><label for="bp">Publisher</label><input id="bp" maxlength="120"></div><div><label for="bk">Category</label><input id="bk" maxlength="60"></div><div><label for="be">Edition</label><input id="be" maxlength="30"></div><div><label for="bq">Quantity</label><input id="bq" type="number" min="0" value="1" required></div><div><label for="bs">Shelf</label><input id="bs" maxlength="30"></div><div><label for="bpr">Price</label><input id="bpr" type="number" min="0" step="0.01"></div><button class="btn">Save book</button><button type="button" class="btn ghost" id="bx" hidden>Cancel edit</button></form>
<div class="row"><div><label for="q">Search</label><input id="q" type="search" placeholder="Title, author, ISBN, Book ID"></div><div><label><input type="checkbox" id="av"> Only available</label></div><button class="btn ghost" id="inv">Export inventory CSV</button></div><div id="bl" class="tw"></div><div class="pager"><button class="btn ghost sm" id="pv">Previous</button><span id="pg"></span><button class="btn ghost sm" id="nx">Next</button></div></section>
<section id="issue" hidden><form id="if" class="panel row"><div><label for="is">Find book</label><input id="is" type="search" placeholder="Type title or Book ID"></div><div><label for="ib">Book</label><select id="ib" required></select></div><div><label for="it">Borrower</label><select id="it"><option value="student">Student</option><option value="teacher">Teacher</option></select></div><div id="yw"><label for="iy">Academic year</label><select id="iy"></select></div><div id="dw"><label for="id">Division</label><select id="id"></select></div><div id="sw"><label for="ie">Student</label><select id="ie"></select></div><div id="tw" hidden><label for="ic">Teacher</label><select id="ic"></select></div><div><label for="iu">Due date</label><input id="iu" type="date" required></div><button class="btn">Issue book</button></form></section>
<section id="tx" hidden><div class="row"><div><label for="ts">Show</label><select id="ts"><option value="issued">Issued</option><option value="overdue">Overdue</option><option value="returned">Returned</option><option value="all">All</option></select></div><div><label for="tq">Filter by name</label><input id="tq" type="search"></div><button class="btn ghost" id="tx2">Export CSV</button><button class="btn ghost" onclick="window.print()">Print</button></div><div id="tl" class="tw"></div></section></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script><script src="js/exams.js"></script><script src="js/fees.js"></script>
<script>
(async()=>{const p=await Auth.require([...ADMIN_ROLES,"librarian","teacher","class_teacher","reception"]);Auth.shell(p);const $=id=>document.getElementById(id);

const mgr=["super_admin","school_admin","librarian"].includes(p.role),PS=25;let page=0,rows=[],editId=null,cls=[],tn=[],txr=[];$("bf").hidden=!mgr;if(!mgr)document.querySelector("[data-t=issue]").hidden=true;
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{["books","issue","tx"].forEach(s=>$(s).hidden=s!==b.dataset.t);document.querySelectorAll("[data-t]").forEach(x=>x.className="btn"+(x===b?"":" ghost"));if(b.dataset.t==="tx")loadTx()});
const bl=$("bl");
async function loadBooks(){bl.innerHTML='<div class="state">Loading...</div>';try{let q=db.from("books").select("*",{count:"exact"});const t=Students.safe($("q").value);if(t)q=q.or(`title.ilike.%${t}%,author.ilike.%${t}%,isbn.ilike.%${t}%,book_code.ilike.%${t}%`);if($("av").checked)q=q.gt("available_quantity",0).eq("status","active");
const {data,error,count}=await q.order("title").range(page*PS,page*PS+PS-1);if(error)throw error;rows=data;$("pg").textContent=count?`${page*PS+1}-${Math.min(count,(page+1)*PS)} of ${count}`:"0";$("pv").disabled=page===0;$("nx").disabled=(page+1)*PS>=count;
if(!data.length)return U.state(bl,"empty","No books found.");
bl.innerHTML="<table><thead><tr><th>ID</th><th>Title</th><th>Author</th><th>Category</th><th>Shelf</th><th>Total</th><th>Available</th><th>Status</th><th></th></tr></thead><tbody>"+data.map(b=>`<tr><td>${U.esc(b.book_code)}</td><td>${U.esc(b.title)}</td><td>${U.esc(b.author||"")}</td><td>${U.esc(b.category||"")}</td><td>${U.esc(b.shelf||"")}</td><td>${b.quantity}</td><td>${b.available_quantity}</td><td><span class="badge ${b.status==="active"?"on":""}">${b.status}</span></td><td>${mgr?`<button class="btn sm" data-e="${b.id}">Edit</button> <button class="btn sm ghost" data-s="${b.id}">${b.status==="active"?"Deactivate":"Activate"}</button>`:""}</td></tr>`).join("")+"</tbody></table>"}catch(e){U.friendly(e);U.state(bl,"error","Unable to load books. Please try again.")}}
bl.addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;const x=rows.find(r=>r.id===(b.dataset.e||b.dataset.s));if(!x)return;
if(b.dataset.e){editId=x.id;$("bt").textContent="Edit book";[["bc","book_code"],["bi","isbn"],["bn","title"],["ba","author"],["bp","publisher"],["bk","category"],["be","edition"],["bq","quantity"],["bs","shelf"],["bpr","price"]].forEach(([i,k])=>$(i).value=x[k]??"");$("bx").hidden=false;$("bf").scrollIntoView()}
else{const {error}=await db.from("books").update({status:x.status==="active"?"inactive":"active"}).eq("id",x.id);if(error){U.friendly(error);return U.toast("Could not save.","err")}U.audit("Book status changed","books",x.id);loadBooks()}});
$("bx").onclick=()=>{editId=null;$("bf").reset();$("bt").textContent="Add book";$("bx").hidden=true};
$("bf").addEventListener("submit",async ev=>{ev.preventDefault();const v=i=>$(i).value.trim()||null,row={book_code:v("bc"),isbn:v("bi"),title:v("bn"),author:v("ba"),publisher:v("bp"),category:v("bk"),edition:v("be"),quantity:Number($("bq").value),shelf:v("bs"),price:$("bpr").value===""?null:Number($("bpr").value)};
if(!editId)row.available_quantity=row.quantity;const r=editId?await db.from("books").update(row).eq("id",editId).select("id").single():await db.from("books").insert(row).select("id").single();
if(r.error){U.friendly(r.error);return U.toast(r.error.code==="23505"?"This Book ID already exists.":String(r.error.message).includes("quantity below")?"Quantity cannot be lower than the copies currently issued.":"Could not save the book.","err")}
U.audit(editId?"Book updated":"Book added","books",r.data.id);U.toast("Saved.");$("bx").onclick();loadBooks()});
$("q").addEventListener("input",U.debounce(()=>{page=0;loadBooks()}));$("av").onchange=()=>{page=0;loadBooks()};$("pv").onclick=()=>{page--;loadBooks()};$("nx").onclick=()=>{page++;loadBooks()};
$("inv").onclick=async()=>{try{const {data,error}=await db.from("books").select("book_code,isbn,title,author,publisher,category,edition,quantity,available_quantity,shelf,price,status").order("title").limit(5000);if(error)throw error;Students.download("library-inventory.csv",Students.csv([["book_id","isbn","title","author","publisher","category","edition","quantity","available","shelf","price","status"],...data.map(b=>Object.values(b))]))}catch(e){U.friendly(e);U.toast("Could not export.","err")}};
if(mgr){try{const [c,t]=await Promise.all([db.from("classes").select("id,name,sort_order").order("sort_order"),db.from("teacher_names").select("id,full_name").order("full_name")]);if(c.error||t.error)throw c.error||t.error;cls=c.data;$("ic").innerHTML=t.data.map(x=>`<option value="${x.id}">${U.esc(x.full_name||"Teacher")}</option>`).join("");await Ex.yearSelect($("iy"));loadDivs()}catch(e){U.friendly(e)}
$("iu").value=new Date(Date.now()+14*864e5).toLocaleDateString("en-CA")}
async function loadDivs(){const {data,error}=await db.from("divisions").select("id,name,class_id").eq("academic_year_id",$("iy").value);if(error){U.friendly(error);return}const d=data.map(x=>({...x,l:(cls.find(c=>c.id===x.class_id)?.name||"")+" - "+x.name,o:cls.findIndex(c=>c.id===x.class_id)})).sort((a,b)=>a.o-b.o||a.name.localeCompare(b.name));$("id").innerHTML=d.map(x=>`<option value="${x.id}">${U.esc(x.l)}</option>`).join("");loadStu()}
async function loadStu(){if(!$("id").value){$("ie").innerHTML="";return}const {data,error}=await db.from("student_enrollments").select("id,roll_no,students!inner(first_name,last_name)").eq("division_id",$("id").value).eq("academic_year_id",$("iy").value).eq("status","active").order("roll_no",{nullsFirst:false});if(error){U.friendly(error);return}$("ie").innerHTML=data.map(x=>`<option value="${x.id}">${U.esc((x.roll_no??"-")+" | "+x.students.first_name+" "+x.students.last_name)}</option>`).join("")}
async function findBooks(){const t=Students.safe($("is").value);let q=db.from("books").select("id,book_code,title,available_quantity").eq("status","active").gt("available_quantity",0).order("title").limit(30);if(t)q=q.or(`title.ilike.%${t}%,book_code.ilike.%${t}%`);const {data,error}=await q;if(error){U.friendly(error);return}$("ib").innerHTML=data.map(b=>`<option value="${b.id}">${U.esc(b.book_code+" | "+b.title+" ("+b.available_quantity+" left)")}</option>`).join("")}
$("is").addEventListener("input",U.debounce(findBooks));document.querySelector("[data-t=issue]").addEventListener("click",findBooks);
$("it").onchange=()=>{const s=$("it").value==="student";["yw","dw","sw"].forEach(i=>$(i).hidden=!s);$("tw").hidden=s};$("iy").onchange=loadDivs;$("id").onchange=loadStu;
$("if").addEventListener("submit",async ev=>{ev.preventDefault();const s=$("it").value==="student";if(!$("ib").value)return U.toast("Choose a book.","err");if(s&&!$("ie").value)return U.toast("Choose a student.","err");
if(!await U.confirm("Issue this book?"))return;const {error}=await db.rpc("issue_book",{p_book:$("ib").value,p_type:$("it").value,p_enrollment:s?$("ie").value:null,p_teacher:s?null:$("ic").value,p_due:$("iu").value});
if(error){U.friendly(error);return U.toast(String(error.message).includes("no copies")?"No copies are available.":"Could not issue the book.","err")}U.audit("Book issued","book_transactions",$("ib").value);U.toast("Book issued.");findBooks();loadBooks()});
async function loadTx(){const tl=$("tl");tl.innerHTML='<div class="state">Loading...</div>';try{const {data:t}=await db.from("teacher_names").select("id,full_name");tn=t||[];const f=$("ts").value;
let q=db.from("book_transactions").select("id,borrower_type,issue_date,due_date,return_date,status,fine,teacher_id,books(title,book_code),student_enrollments(students(first_name,last_name,admission_no),divisions(name,classes(name)))").order("due_date").limit(300);
if(f==="issued"||f==="overdue")q=q.eq("status","issued");if(f==="overdue")q=q.lt("due_date",Fee.today());if(f==="returned")q=q.eq("status","returned");const {data,error}=await q;if(error)throw error;
txr=data.map(x=>({...x,who:x.borrower_type==="teacher"?(tn.find(a=>a.id===x.teacher_id)?.full_name||"Teacher"):(x.student_enrollments?x.student_enrollments.students.first_name+" "+x.student_enrollments.students.last_name+" ("+x.student_enrollments.divisions.classes.name+" - "+x.student_enrollments.divisions.name+")":"Student")}));drawTx()}catch(e){U.friendly(e);U.state(tl,"error","Unable to load. Please try again.")}}
function drawTx(){const t=$("tq").value.trim().toLowerCase(),v=txr.filter(x=>!t||x.who.toLowerCase().includes(t)||x.books.title.toLowerCase().includes(t));if(!v.length)return U.state($("tl"),"empty","Nothing to show.");
$("tl").innerHTML="<table><thead><tr><th>Book</th><th>Borrower</th><th>Issued</th><th>Due</th><th>Returned</th><th>Fine</th><th></th></tr></thead><tbody>"+v.map(x=>`<tr><td>${U.esc(x.books.title)}</td><td>${U.esc(x.who)}</td><td>${U.esc(x.issue_date)}</td><td${x.status==="issued"&&x.due_date<Fee.today()?' style="color:var(--bad)"':""}>${U.esc(x.due_date)}</td><td>${U.esc(x.return_date||"")}</td><td>${Fee.inr(x.fine)}</td><td>${mgr&&x.status==="issued"?`<button class="btn sm" data-r="${x.id}">Return</button>`:""}</td></tr>`).join("")+"</tbody></table>"}
$("tl").addEventListener("click",async ev=>{const b=ev.target.closest("button[data-r]");if(!b||!await U.confirm("Mark this book as returned?"))return;const {data,error}=await db.rpc("return_book",{p_tx:b.dataset.r});if(error){U.friendly(error);return U.toast("Could not return the book.","err")}U.audit("Book returned","book_transactions",b.dataset.r);U.toast(Number(data)>0?"Returned. Fine: "+Fee.inr(data):"Returned.");loadTx();loadBooks()});
$("ts").onchange=loadTx;$("tq").addEventListener("input",U.debounce(drawTx));
$("tx2").onclick=()=>txr.length?Students.download("library-transactions.csv",Students.csv([["book","borrower","issued","due","returned","fine","status"],...txr.map(x=>[x.books.title,x.who,x.issue_date,x.due_date,x.return_date,x.fine,x.status])])):U.toast("Nothing to export.","err");loadBooks();
})();
</script></body></html>
