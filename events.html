<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Events | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">Events</h1><form id="f" class="panel row" hidden><h3 style="grid-column:1/-1">New event (saved as draft until published)</h3><div><label for="et">Event name</label><input id="et" required maxlength="150"></div><div><label for="ek">Type</label><select id="ek"></select></div><div><label for="ed">Date</label><input id="ed" type="date" required></div><div><label for="es">Start time</label><input id="es" type="time"></div><div><label for="ee">End time</label><input id="ee" type="time"></div><div><label for="ev">Venue</label><input id="ev" maxlength="120"></div><div><label for="ea">Audience</label><select id="ea"><option value="everyone">Everyone</option><option value="parents">Parents</option><option value="students">Students</option><option value="teachers">Teachers</option><option value="staff">Staff</option></select></div><div style="grid-column:1/-1"><label for="ex">Description</label><textarea id="ex" rows="3" maxlength="2000"></textarea></div><div><label for="ef">Poster (PDF, JPG or PNG, up to 5 MB)</label><input id="ef" type="file" accept=".pdf,.jpg,.jpeg,.png"></div><div><label><input type="checkbox" id="epub"> Show on the public website (text only)</label></div><button class="btn" id="eb">Save draft</button></form>
<div class="row"><div><label for="vm">View</label><select id="vm"><option value="list">List</option><option value="calendar">Calendar</option></select></div><div id="fw"><label for="fl">Show</label><select id="fl"><option value="upcoming">Upcoming</option><option value="past">Past</option><option value="all">All</option></select></div></div><div id="cn" hidden class="row"><button class="btn ghost" id="pm">Previous month</button><b id="mt"></b><button class="btn ghost" id="nm">Next month</button></div><div id="list" class="tw"></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script><script src="js/exams.js"></script><script src="js/fees.js"></script><script src="js/gallery.js"></script>
<script>
(async()=>{const p=await Auth.require("*");Auth.shell(p);const $=id=>document.getElementById(id);

const list=$("list"),canMan=["super_admin","school_admin","principal","reception"].includes(p.role),TYPES=["Annual Day","Sports Day","Independence Day","Republic Day","Teachers Day","Children's Day","Cultural Program","Science Exhibition","Field Trip","Parent Meeting","Prize Distribution","Other"];let rows=[],mon=new Date();mon.setDate(1);
$("f").hidden=!canMan;$("ek").innerHTML=TYPES.map(t=>`<option>${U.esc(t)}</option>`).join("");
const T=v=>String(v||"").slice(0,5),ymd=d=>d.toLocaleDateString("en-CA");
async function load(){list.innerHTML='<div class="state">Loading...</div>';const cal=$("vm").value==="calendar";$("cn").hidden=!cal;$("fw").hidden=cal;
try{let q=db.from("events").select("*").limit(200);
if(cal){const a=new Date(mon.getFullYear(),mon.getMonth(),1),b=new Date(mon.getFullYear(),mon.getMonth()+1,0);q=q.gte("event_date",ymd(a)).lte("event_date",ymd(b)).order("event_date");$("mt").textContent=mon.toLocaleDateString("en-IN",{month:"long",year:"numeric"})}
else{const f=$("fl").value;if(f==="upcoming")q=q.gte("event_date",Fee.today());if(f==="past")q=q.lt("event_date",Fee.today());q=q.order("event_date",{ascending:f!=="past"})}
const {data,error}=await q;if(error)throw error;rows=data;cal?drawCal():draw()}catch(e){U.friendly(e);U.state(list,"error","Unable to load events. Please try again.")}}
function draw(){if(!rows.length)return U.state(list,"empty","No events found.");
list.innerHTML=rows.map(e=>`<div class="card" style="margin-bottom:.8rem"><h3>${U.esc(e.title)} <span class="badge ${e.status==="published"?"on":""}">${U.esc(e.status)}</span></h3><p>${U.esc(e.event_type)} | ${U.esc(e.event_date)}${e.start_time?" | "+T(e.start_time)+(e.end_time?"-"+T(e.end_time):""):""}${e.venue?" | "+U.esc(e.venue):""} | Audience: ${U.esc(e.audience)}${e.is_public?" | Public":""}</p><p style="white-space:pre-wrap">${U.esc(e.description||"")}</p>${e.image_path?`<button class="btn sm ghost" data-o="${e.id}">Open poster</button> `:""}${canMan&&e.status==="draft"?`<button class="btn sm" data-p="${e.id}">Publish</button> `:""}${canMan&&e.status!=="cancelled"?`<button class="btn sm ghost" data-c="${e.id}">Cancel event</button>`:""}</div>`).join("")}
function drawCal(){const y=mon.getFullYear(),m=mon.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();let h="<table><thead><tr>"+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<th>${d}</th>`).join("")+"</tr></thead><tbody><tr>";
for(let i=0;i<first;i++)h+="<td></td>";for(let d=1;d<=days;d++){if((first+d-1)%7===0&&d>1)h+="</tr><tr>";const key=ymd(new Date(y,m,d));h+=`<td style="vertical-align:top"><b>${d}</b>${rows.filter(e=>e.event_date===key).map(e=>`<br><small>${U.esc(e.title)}${e.status==="cancelled"?" (cancelled)":""}</small>`).join("")}</td>`}
h+="</tr></tbody></table>";list.innerHTML=h}
list.addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;const id=b.dataset.o||b.dataset.p||b.dataset.c,e=rows.find(x=>x.id===id);if(!e)return;
try{if(b.dataset.o)await Gal.open("events",e.image_path);
else if(b.dataset.p){if(!await U.confirm("Publish this event? The audience will be notified."))return;const {error}=await db.rpc("publish_event",{p_id:id});if(error)throw error;U.audit("Event published","events",id);U.toast("Published.");load()}
else{if(!await U.confirm("Cancel this event?"))return;const {error}=await db.from("events").update({status:"cancelled"}).eq("id",id);if(error)throw error;U.audit("Event cancelled","events",id);U.toast("Cancelled.");load()}}
catch(er){U.friendly(er);U.toast("Could not complete that. Please try again.","err")}});
$("vm").onchange=load;$("fl").onchange=load;$("pm").onclick=()=>{mon.setMonth(mon.getMonth()-1);load()};$("nm").onclick=()=>{mon.setMonth(mon.getMonth()+1);load()};
$("f").addEventListener("submit",async ev=>{ev.preventDefault();const f=$("ef").files[0];if($("ee").value&&$("es").value&&$("ee").value<=$("es").value)return U.toast("End time must be after start time.","err");
if(f&&(f.size>5242880||!["application/pdf","image/jpeg","image/png"].includes(f.type)))return U.toast("Poster must be a PDF, JPG or PNG up to 5 MB.","err");$("eb").disabled=true;
try{const row={title:$("et").value.trim(),event_type:$("ek").value,event_date:$("ed").value,start_time:$("es").value||null,end_time:$("ee").value||null,venue:$("ev").value.trim()||null,audience:$("ea").value,description:$("ex").value.trim()||null,is_public:$("epub").checked};
if(f){const path=`${crypto.randomUUID()}/${f.name.replace(/[^A-Za-z0-9._-]/g,"_")}`;const {error:ue}=await db.storage.from("events").upload(path,f,{contentType:f.type,upsert:false});if(ue)throw ue;row.image_path=path}
const {data,error}=await db.from("events").insert(row).select("id").single();if(error)throw error;U.audit("Event created (draft)","events",data.id);U.toast("Saved as draft. Press Publish when ready.");ev.target.reset();load()}
catch(e){U.friendly(e);U.toast("Could not save the event. Please check the details.","err")}$("eb").disabled=false});load();
})();
</script></body></html>
