<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Subjects | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" aria-label="Sidebar"></aside>
<div><header class="top"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1>Subjects</h1><form id="f" class="row"><div><label for="n">Subject name</label><input id="n" required maxlength="60"></div><div><label for="c">Code (optional)</label><input id="c" maxlength="10"></div><button class="btn">Add subject</button></form><div id="list" class="tw"><div class="state">Loading...</div></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script>
<script>
(async()=>{const p=await Auth.require(ADMIN_ROLES);Auth.shell(p);const list=document.getElementById("list");

async function load(){try{const {data,error}=await db.from("subjects").select("*").order("name");if(error)throw error;
if(!data.length)return U.state(list,"empty","No subjects yet. Add the first one above.");
list.innerHTML="<table><thead><tr><th>Subject</th><th>Code</th><th>Status</th><th></th></tr></thead><tbody>"+data.map(x=>`<tr><td>${U.esc(x.name)}</td><td>${U.esc(x.code||"")}</td><td><span class="badge ${x.is_active?"on":""}">${x.is_active?"Active":"Inactive"}</span></td><td><button class="btn sm ghost" data-id="${x.id}" data-on="${x.is_active}">${x.is_active?"Deactivate":"Activate"}</button></td></tr>`).join("")+"</tbody></table>";
}catch(e){U.friendly(e);U.state(list,"error","Unable to load subjects. Please try again.")}}
list.addEventListener("click",async ev=>{const b=ev.target.closest("button[data-id]");if(!b)return;
const {error}=await db.from("subjects").update({is_active:b.dataset.on!=="true"}).eq("id",b.dataset.id);
if(error){U.friendly(error);return U.toast("Could not save the change.","err")}U.audit("Subject status changed","subjects",b.dataset.id);load()});
document.getElementById("f").addEventListener("submit",async ev=>{ev.preventDefault();
const {data,error}=await db.from("subjects").insert({name:n.value.trim(),code:c.value.trim()||null}).select("id").single();
if(error){U.friendly(error);return U.toast(error.code==="23505"?"This subject name or code already exists.":"Could not add the subject.","err")}
U.audit("Subject created","subjects",data.id);ev.target.reset();U.toast("Subject added.");load()});
load();
})();
</script></body></html>
