<!doctype html><html lang="en"><head><meta name="description" content="Saraswati English Medium School: school management portal."><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Parent-teacher meetings | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1>Parent-teacher meetings</h1>
<form id="nf" class="panel row" hidden><h3 style="grid-column:1/-1">Plan a meeting</h3><div><label for="nt">Title</label><input id="nt" required minlength="3" maxlength="120" placeholder="Term 1 parent-teacher meeting"></div><div><label for="nd">Class and division</label><select id="nd"></select></div><div><label for="ndt">Date</label><input id="ndt" type="date" required></div><div><label for="ns">From</label><input id="ns" type="time" value="10:00" required></div><div><label for="ne">Until</label><input id="ne" type="time" value="13:00" required></div><div><label for="nm">Minutes per parent</label><select id="nm"><option>10</option><option selected>15</option><option>20</option><option>30</option></select></div><div style="grid-column:1/-1"><label for="nn">Note for parents (optional)</label><input id="nn" maxlength="500" placeholder="Please bring the report card"></div><button class="btn">Create and tell parents</button></form>
<div id="out"><div class="state">Loading...</div></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script>
<script>
(async()=>{const p=await Auth.require("*");Auth.shell(p);const $=id=>document.getElementById(id);
const parent=p.role==="parent",staffOk=[...ADMIN_ROLES,"reception","teacher","class_teacher"].includes(p.role);
if(!parent&&!staffOk){U.state($("out"),"error","This page is for parents and teachers.");return}
const T=t=>{const [h,m]=String(t).split(":");const x=+h%12||12;return x+":"+m+(+h<12?" AM":" PM")};
let events=[],slots=[],kids=[];
async function load(){try{
const e=await db.from("ptm_events").select("*,divisions(name,classes(name))").order("ptm_date",{ascending:false}).limit(60);if(e.error)throw e.error;events=e.data;
const s=await db.from("ptm_slots").select("id,event_id,slot_start,slot_end,enrollment_id,student_enrollments(students(first_name,last_name,admission_no)),ptm_notes(note)").order("slot_start").limit(2000);if(s.error)throw s.error;slots=s.data;
if(parent){const k=await db.from("student_enrollments").select("id,division_id,students(first_name,last_name)").eq("status","active");if(k.error)throw k.error;kids=k.data}
draw()}catch(x){U.friendly(x);U.state($("out"),"error","Unable to load. Please try again.")}}
function dname(e){return U.esc((e.divisions?.classes?.name||"")+" - "+(e.divisions?.name||""))}
function draw(){if(!events.length){return U.state($("out"),"empty",parent?"No meetings are planned yet.":"No meetings yet. Plan one above.")}
$("out").innerHTML=events.map(e=>{const sl=slots.filter(x=>x.event_id===e.id),open=e.status==="open"&&e.ptm_date>=new Date().toISOString().slice(0,10);
const head='<div class="card" style="margin-bottom:1rem"><h3>'+U.esc(e.title)+' <span class="badge '+(open?"on":"")+'">'+(open?"open":"closed")+'</span></h3><p>'+U.esc(e.ptm_date)+' | '+T(e.start_time)+' - '+T(e.end_time)+' | '+dname(e)+(e.note?'<br>'+U.esc(e.note):'')+'</p>';
if(parent){const my=kids.filter(k=>k.division_id===e.division_id);return head+my.map(k=>{const mine=sl.find(x=>x.enrollment_id===k.id),free=sl.filter(x=>!x.enrollment_id),nm=U.esc(k.students.first_name+" "+k.students.last_name);
return '<div class="panel"><b>'+nm+'</b><br>'+(mine?'Your time: <b>'+T(mine.slot_start)+'</b> '+(open?'<button class="btn sm ghost" data-c="'+mine.id+'">Cancel</button>':''):open?(free.length?'<div class="row">'+free.map(x=>'<button class="btn sm ghost" data-b="'+x.id+'" data-e="'+k.id+'">'+T(x.slot_start)+'</button>').join("")+'</div>':'All times are taken.'):'This meeting is closed.')+'</div>'}).join("")+'</div>'}
return head+(open?'<p><button class="btn sm ghost" data-x="'+e.id+'">Close meeting</button></p>':'')+'<div class="tw"><table><thead><tr><th>Time</th><th>Parent of</th><th>Private note</th><th></th></tr></thead><tbody>'+sl.map(x=>{const st=x.student_enrollments?.students;return '<tr><td>'+T(x.slot_start)+'</td><td>'+(st?U.esc(st.first_name+" "+st.last_name)+'<br><small>'+U.esc(st.admission_no)+'</small>':'<small>free</small>')+'</td><td>'+(st?'<input class="nn" data-s="'+x.id+'" maxlength="1000" value="'+U.esc(x.ptm_notes?.[0]?.note||x.ptm_notes?.note||"")+'" aria-label="Private note"> <button class="btn sm" data-n="'+x.id+'">Save</button>':'')+'</td><td>'+(st&&open?'<button class="btn sm ghost" data-c="'+x.id+'">Cancel booking</button>':'')+'</td></tr>'}).join("")+'</tbody></table></div></div>'}).join("")}
$("out").addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;
try{if(b.dataset.b){const {error}=await db.rpc("book_ptm_slot",{p_slot:b.dataset.b,p_enrollment:b.dataset.e});if(error)throw error;U.toast("Booked.")}
else if(b.dataset.c){if(!await U.confirm("Cancel this booking?"))return;const {error}=await db.rpc("cancel_ptm_slot",{p_slot:b.dataset.c});if(error)throw error;U.toast("Cancelled.")}
else if(b.dataset.x){if(!await U.confirm("Close this meeting? Parents can no longer book."))return;const {error}=await db.rpc("close_ptm",{p_event:b.dataset.x});if(error)throw error}
else if(b.dataset.n){const i=b.closest("tr").querySelector(".nn");const {error}=await db.rpc("save_ptm_note",{p_slot:b.dataset.n,p_note:i.value});if(error)throw error;U.toast("Saved.");return}
else return;load()}catch(e){U.friendly(e);const m=String(e.message||"");U.toast(/already taken/.test(m)?"Someone just took this time. Please choose another.":/already booked/.test(m)?"This child already has a time.":"Could not save. Please try again.","err");load()}});
if(!parent){$("nf").hidden=false;$("ndt").min=new Date().toISOString().slice(0,10);
try{let q=db.from("divisions").select("id,name,class_teacher_id,classes(name,sort_order),academic_years!inner(is_active)").eq("academic_years.is_active",true);if(["teacher","class_teacher"].includes(p.role))q=q.eq("class_teacher_id",p.id);const {data,error}=await q;if(error)throw error;
$("nd").innerHTML=data.sort((a,b)=>a.classes.sort_order-b.classes.sort_order||a.name.localeCompare(b.name)).map(x=>'<option value="'+x.id+'">'+U.esc(x.classes.name+" - "+x.name)+'</option>').join("")||'<option value="">No division</option>'}catch(e){U.friendly(e)}
$("nf").addEventListener("submit",async ev=>{ev.preventDefault();if(!$("nd").value)return U.toast("Choose a division.","err");if(!await U.confirm("Create this meeting? Parents of the division will be notified."))return;
const {error}=await db.rpc("create_ptm",{p_title:$("nt").value.trim(),p_division:$("nd").value,p_date:$("ndt").value,p_start:$("ns").value,p_end:$("ne").value,p_slot:Number($("nm").value),p_note:$("nn").value.trim()||null});
if(error){U.friendly(error);return U.toast(/not allowed/.test(error.message)?"You can plan meetings only for your own division.":/between 1 and 60/.test(error.message)?"Choose a time range that gives 1 to 60 slots.":"Could not create the meeting.","err")}U.audit("PTM created","ptm_events",$("nd").value);ev.target.reset();$("ns").value="10:00";$("ne").value="13:00";$("nm").value="15";U.toast("Meeting created.");load()})}
load();
})();
</script><script src="js/i18n.js"></script></body></html>
