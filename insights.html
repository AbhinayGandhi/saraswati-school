<!doctype html><html lang="en"><head><meta name="description" content="Saraswati English Medium School: school management portal."><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Student insights | Saraswati English Medium School</title>
<style>.lv{display:inline-block;padding:.1rem .6rem;border-radius:1rem;font-weight:700;font-size:.85rem}.lv.h{background:#fde8e8;color:#a61b1b}.lv.m{background:#fff3d6;color:#8a5a00}.lv.l{background:#e3f4ea;color:#1b6b3a}@media(max-width:700px){#cnt{display:grid!important;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.8rem}#cnt .card{padding:.6rem}#cnt .card h3{font-size:1.4rem;margin:0}#cnt .card p{margin:.1rem 0 0;font-size:.8rem}
#out table,#out tbody,#out tr,#out td{display:block;width:100%}#out thead{display:none}#out tr{border:1px solid var(--line,#2a3446);border-radius:10px;padding:.6rem .8rem;margin-bottom:.7rem}#out td{border:0;padding:.2rem 0}
#out td[data-l]::before{content:attr(data-l);display:block;font-size:.75rem;opacity:.7;text-transform:uppercase;letter-spacing:.03em}}</style></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1>Student insights</h1>
<p>Students who may need attention, found from <b>attendance (last 30 days)</b>, <b>exam marks</b> and <b>overdue fees</b>. Every flag shows its reason. This is a helper for teachers; please talk to the family before drawing any conclusion.</p>
<div class="row noprint"><div><label for="dv">Division</label><select id="dv"></select></div><div><label for="lv">Show</label><select id="lv"><option value="2">Needs attention (medium and high)</option><option value="4">High only</option><option value="0">All students</option></select></div><button class="btn ghost" id="ex">Export CSV</button><button class="btn ghost" onclick="window.print()">Print</button></div>
<div id="cnt" class="grid"></div><div id="out" class="tw"><div class="state">Loading...</div></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script>
<script>
(async()=>{const p=await Auth.require([...ADMIN_ROLES,"teacher","class_teacher"]);Auth.shell(p);const $=id=>document.getElementById(id);let rows=[],csv=[];
try{const {data,error}=await db.from("divisions").select("id,name,classes(name,sort_order),academic_years!inner(is_active)").eq("academic_years.is_active",true);if(error)throw error;
$("dv").innerHTML='<option value="">All my divisions</option>'+data.sort((a,b)=>a.classes.sort_order-b.classes.sort_order||a.name.localeCompare(b.name)).map(x=>`<option value="${x.id}">${U.esc(x.classes.name+" - "+x.name)}</option>`).join("")}catch(e){U.friendly(e)}
const lev=n=>n>=4?["h","High"]:n>=2?["m","Medium"]:["l","Low"];
function draw(){const min=Number($("lv").value),v=rows.filter(r=>r.risk_score>=min);
const h=rows.filter(r=>r.risk_score>=4).length,m=rows.filter(r=>r.risk_score>=2&&r.risk_score<4).length;
$("cnt").innerHTML=`<div class="card"><h3>${rows.length}</h3><p>Students checked</p></div><div class="card"><h3>${h}</h3><p>High</p></div><div class="card"><h3>${m}</h3><p>Medium</p></div>`;
csv=[["student","admission_no","class","attendance_pct_30d","absent_streak","last_exam","last_exam_pct","previous_pct","overdue_fees","level","reasons"],...v.map(r=>[r.student_name,r.admission_no,r.class_name+" - "+r.division_name,r.att_pct??"",r.absent_streak,r.last_exam||"",r.last_pct??"",r.prev_pct??"",r.overdue??"",lev(r.risk_score)[1],(r.reasons||[]).join("; ")])];
$("out").innerHTML=v.length?"<table><thead><tr><th>Student</th><th>Class</th><th>Level</th><th>Why</th></tr></thead><tbody>"+v.map(r=>{const l=lev(r.risk_score);return `<tr><td><a href="student-profile.html?id=${encodeURIComponent(r.student_id||"")}">${U.esc(r.student_name)}</a><br><small>${U.esc(r.admission_no)}</small></td><td data-l="Class">${U.esc(r.class_name+" - "+r.division_name)}</td><td data-l="Level"><span class="lv ${l[0]}">${l[1]}</span></td><td data-l="Why">${(r.reasons||[]).map(x=>U.esc(x)).join("<br>")||"-"}</td></tr>`}).join("")+"</tbody></table>":'<div class="state">No students to show for this choice.</div>'}
async function load(){U.state($("out"),"loading","Loading...");try{const {data,error}=await db.rpc("student_insights",{p_division:$("dv").value||null});if(error)throw error;rows=data||[];draw()}catch(e){U.friendly(e);U.state($("out"),"error","Unable to load. Please try again.")}}
$("dv").onchange=load;$("lv").onchange=draw;$("ex").onclick=()=>csv.length>1?Students.download("student-insights.csv",Students.csv(csv)):U.toast("Nothing to export.","err");load();
})();
</script><script src="js/i18n.js"></script></body></html>
