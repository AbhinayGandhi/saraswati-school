<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Notices | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">Notices</h1><form id="f" class="panel row" hidden><h3 style="grid-column:1/-1">New notice (saved as draft until published)</h3><div><label for="nt">Title</label><input id="nt" required maxlength="150"></div><div><label for="nd">Notice date</label><input id="nd" type="date" required></div><div><label for="ne">Expiry date</label><input id="ne" type="date"></div><div><label for="np">Priority</label><select id="np"><option value="normal">Normal</option><option value="important">Important</option><option value="urgent">Urgent</option></select></div><div><label for="na">Audience</label><select id="na"><option value="everyone">Everyone</option><option value="parents">Parents</option><option value="students">Students</option><option value="teachers">Teachers</option><option value="staff">Staff</option><option value="class">Specific class</option><option value="division">Specific division</option></select></div><div id="cw" hidden><label for="nc">Class</label><select id="nc"></select></div><div id="dw" hidden><label for="nv">Division (active year)</label><select id="nv"></select></div><div style="grid-column:1/-1"><label for="nx">Description</label><textarea id="nx" rows="4" required maxlength="3000"></textarea></div><div><label for="nf">Attachment (PDF, JPG or PNG, up to 5 MB)</label><input id="nf" type="file" accept=".pdf,.jpg,.jpeg,.png"></div><div><label><input type="checkbox" id="npub"> Show on the public website (text only, no attachment)</label></div><button class="btn" id="nb">Save draft</button></form>
<div class="row"><div><label for="fs">Show</label><select id="fs"><option value="">All</option><option value="draft">Drafts</option><option value="published">Published</option><option value="expired">Expired</option></select></div></div><div id="list" class="tw"></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script><script src="js/exams.js"></script><script src="js/fees.js"></script>
<script>
(async()=>{const p=await Auth.require("*");Auth.shell(p);const $=id=>document.getElementById(id);

const list=$("list"),canMan=["super_admin","school_admin","principal","reception"].includes(p.role);let rows=[];$("f").hidden=!canMan;$("nd").value=Fee.today();
function st(n){return n.status==="draft"?"draft":(n.expiry_date&&n.expiry_date<Fee.today()?"expired":"published")}
if(canMan){try{const [c,y]=await Promise.all([db.from("classes").select("id,name").order("sort_order"),db.from("academic_years").select("id").eq("is_active",true).maybeSingle()]);if(c.error||y.error)throw c.error||y.error;$("nc").innerHTML=c.data.map(a=>`<option value="${a.id}">${U.esc(a.name)}</option>`).join("");
if(y.data){const d=await db.from("divisions").select("id,name,classes(name,sort_order)").eq("academic_year_id",y.data.id);if(d.error)throw d.error;$("nv").innerHTML=d.data.sort((a,b)=>a.classes.sort_order-b.classes.sort_order||a.name.localeCompare(b.name)).map(a=>`<option value="${a.id}">${U.esc(a.classes.name+" - "+a.name)}</option>`).join("")}}catch(e){U.friendly(e)}}
$("na").onchange=()=>{$("cw").hidden=$("na").value!=="class";$("dw").hidden=$("na").value!=="division"};
async function load(){list.innerHTML='<div class="state">Loading...</div>';try{const {data,error}=await db.from("notices").select("*").order("notice_date",{ascending:false}).limit(100);if(error)throw error;rows=data;draw()}catch(e){U.friendly(e);U.state(list,"error","Unable to load notices. Please try again.")}}
function draw(){const f=$("fs").value,v=rows.filter(n=>!f||st(n)===f);if(!v.length)return U.state(list,"empty","No notices found.");
list.innerHTML=v.map(n=>{const s=st(n);return `<div class="card" style="margin-bottom:.8rem"><h3>${U.esc(n.title)} <span class="badge ${s==="published"?"on":""}">${s}</span> ${n.priority!=="normal"?`<span class="badge">${U.esc(n.priority)}</span>`:""}</h3><p>${U.esc(n.notice_date)}${n.expiry_date?" to "+U.esc(n.expiry_date):""} | Audience: ${U.esc(n.audience)}${n.is_public?" | Public":""}</p><p style="white-space:pre-wrap">${U.esc(n.description)}</p>${n.attachment_path?`<button class="btn sm ghost" data-o="${n.id}">Open attachment</button> `:""}${canMan&&n.status==="draft"?`<button class="btn sm" data-p="${n.id}">Publish</button>`:""}</div>`}).join("")}
list.addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;
if(b.dataset.o){const n=rows.find(x=>x.id===b.dataset.o),w=window.open("","_blank");const {data,error}=await db.storage.from("notices").createSignedUrl(n.attachment_path,300);if(error){w&&w.close();U.friendly(error);return U.toast("Could not open the file.","err")}w?w.location=data.signedUrl:location.href=data.signedUrl}
else if(b.dataset.p){const n=rows.find(x=>x.id===b.dataset.p);if(!await U.confirm("Publish this notice? The audience will be notified and it cannot be unpublished."))return;const {error}=await db.rpc("publish_notice",{p_id:n.id});if(error){U.friendly(error);return U.toast("Could not publish. Please try again.","err")}U.audit("Notice published","notices",n.id);U.toast("Published.");load()}});
$("fs").onchange=draw;
$("f").addEventListener("submit",async ev=>{ev.preventDefault();const f=$("nf").files[0],a=$("na").value;if($("ne").value&&$("ne").value<$("nd").value)return U.toast("Expiry date cannot be before the notice date.","err");
if(a==="division"&&!$("nv").value)return U.toast("No division available. Set an active academic year first.","err");
if(f&&(f.size>5242880||!["application/pdf","image/jpeg","image/png"].includes(f.type)))return U.toast("Attachment must be a PDF, JPG or PNG up to 5 MB.","err");$("nb").disabled=true;
try{const row={title:$("nt").value.trim(),description:$("nx").value.trim(),notice_date:$("nd").value,expiry_date:$("ne").value||null,priority:$("np").value,audience:a,class_id:a==="class"?$("nc").value:null,division_id:a==="division"?$("nv").value:null,is_public:$("npub").checked};
if(f){const path=`${crypto.randomUUID()}/${f.name.replace(/[^A-Za-z0-9._-]/g,"_")}`;const {error:ue}=await db.storage.from("notices").upload(path,f,{contentType:f.type,upsert:false});if(ue)throw ue;row.attachment_path=path}
const {data,error}=await db.from("notices").insert(row).select("id").single();if(error)throw error;U.audit("Notice created (draft)","notices",data.id);U.toast("Saved as draft. Press Publish when ready.");ev.target.reset();$("nd").value=Fee.today();load()}
catch(e){U.friendly(e);U.toast("Could not save the notice. Please check the details.","err")}$("nb").disabled=false});load();
})();
</script></body></html>
