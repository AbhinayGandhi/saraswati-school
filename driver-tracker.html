<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="description" content="Saraswati English Medium School: school bus driver page."><link rel="stylesheet" href="css/style.css"><title>Bus driver | Saraswati English Medium School</title>
<style>body{padding:1rem;max-width:30rem;margin:0 auto}.big{display:block;width:100%;padding:1.1rem;font-size:1.15rem;margin:.6rem 0}.st{padding:.8rem;border-radius:.5rem;background:#eef2f7;margin:.8rem 0;font-weight:700}.ok{background:#e3f4ea}.bad{background:#fde8e8}</style></head>
<body><h1>School bus / स्कूल बस</h1>
<p id="rt" style="font-size:1.1rem;font-weight:700">Loading...</p>
<div id="stat" class="st" role="status" aria-live="polite">Checking link...</div>
<div id="ctl" hidden>
<button class="btn big" id="b1">Start morning pickup / सकाळची फेरी सुरू करा</button>
<button class="btn big" id="b2">Start drop trip / घरी सोडण्याची फेरी सुरू करा</button>
<button class="btn big ghost" id="b3" hidden>End trip / फेरी संपवा</button>
</div>
<div id="scanbox" hidden><h2 style="font-size:1.1rem">Student QR scan / विद्यार्थी QR स्कॅन</h2><div class="qrbox"><video id="vid" playsinline muted style="width:100%;border-radius:.5rem" hidden></video><canvas id="cv" hidden></canvas></div>
<button class="btn big ghost" id="cam">Start scanner / स्कॅनर सुरू करा</button>
<div class="row" style="display:flex;gap:.5rem"><input id="man" placeholder="Admission no" autocomplete="off" maxlength="40" style="flex:1"><button class="btn ghost" id="manb" type="button">OK</button></div>
<div id="bmsg" class="st" role="status" aria-live="polite" hidden></div></div>
<p style="font-size:.9rem">Keep this page open and the screen on while driving. Parents see the bus on the map only while a trip is running.<br>गाडी चालवताना हे पेज उघडे आणि स्क्रीन चालू ठेवा. फेरी सुरू असतानाच पालकांना बस नकाशावर दिसते.</p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script>
<script>
(()=>{const $=id=>document.getElementById(id);let db;try{db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false}})}catch(e){$("stat").textContent="Setup problem. Please tell the school office.";return}
let tok="";try{const q=new URLSearchParams(location.search).get("k");if(q){localStorage.setItem("ses_drv",q)}tok=q||localStorage.getItem("ses_drv")||""}catch(e){tok=new URLSearchParams(location.search).get("k")||""}
let watch=null,timer=null,last=null,active=false,wake=null,fails=0;
const say=(t,c)=>{$("stat").textContent=t;$("stat").className="st "+(c||"")};
async function rpc(a,trip,p){const {data,error}=await db.rpc("driver_ping",{p_token:tok,p_action:a,p_trip:trip||null,p_lat:p?p.latitude:null,p_lng:p?p.longitude:null,p_speed:p&&p.speed!=null?p.speed*3.6:null,p_heading:p&&p.heading!=null?p.heading:null,p_acc:p?p.accuracy:null});if(error)throw error;return data}
function pos(){return new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(x=>ok(x.coords),no,{enableHighAccuracy:true,timeout:15000,maximumAge:3000}):no(new Error("no gps")))}
async function lock(){try{if("wakeLock" in navigator)wake=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(active&&document.visibilityState==="visible")lock()});
function ui(){$("b1").hidden=$("b2").hidden=active;$("b3").hidden=!active;$("scanbox").hidden=!active;if(!active)stopCam()}
async function send(){if(!active||!last)return;try{const r=await rpc("ping",null,last);if(r.ok){fails=0;say("Sending location. Last sent "+new Date().toLocaleTimeString()+" (GPS accuracy "+Math.round(last.accuracy)+" m)","ok")}else if(r.error==="no_trip"){stopAll();say("Trip is not running.","bad")}}catch(e){fails++;say("No internet. Trying again... ("+fails+")","bad")}}
function begin(){active=true;ui();lock();watch=navigator.geolocation.watchPosition(x=>{last=x.coords},()=>say("GPS is off. Turn on location and allow it for this page. / लोकेशन चालू करा.","bad"),{enableHighAccuracy:true,maximumAge:2000,timeout:20000});timer=setInterval(send,10000)}
function stopAll(){active=false;if(watch!=null)navigator.geolocation.clearWatch(watch);watch=null;clearInterval(timer);try{wake&&wake.release()}catch(e){}ui()}
async function start(trip){say("Finding GPS...");try{const c=await pos();last=c;const r=await rpc("start",trip,c);if(!r.ok)return say("Could not start ("+r.error+").","bad");begin();say("Trip started. Parents have been told.","ok")}catch(e){say("Could not get GPS. Turn on location and allow it. / लोकेशन चालू करून परवानगी द्या.","bad")}}
$("b1").onclick=()=>start("pickup");$("b2").onclick=()=>start("drop");
$("b3").onclick=async()=>{if(!confirm("End this trip? / फेरी संपवायची?"))return;try{await rpc("end")}catch(e){}stopAll();say("Trip ended. Thank you.","ok")};
(async()=>{if(!tok){say("This link is not complete. Ask the school office for your bus link.","bad");$("rt").textContent="";return}
try{const r=await rpc("info");if(!r.ok){say("This link is not valid or was changed. Ask the school office for the new link.","bad");$("rt").textContent="";return}
$("rt").textContent=r.route+(r.vehicle?" | "+r.vehicle:"");$("ctl").hidden=false;if(r.active){say("A trip is already running. Press start again to continue sending.")}else say("Ready.")}catch(e){say("Could not connect. Check internet.","bad")}})();

let stream=null,raf=null,lastCode="",lastAt=0,jq=null;
function beep(ok){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?880:220;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},ok?120:300)}catch(e){}if(navigator.vibrate)navigator.vibrate(ok?60:[80,60,80])}
async function board(adm){const m=$("bmsg");m.hidden=false;try{const {data,error}=await db.rpc("driver_board",{p_token:tok,p_admission:adm});if(error)throw error;
if(data.ok){beep(true);m.className="st ok";m.textContent=(data.event==="board"?"Boarded: ":"Got off: ")+data.name+(data.repeat?" (already noted)":"")+"  |  "+data.done+" / "+data.total}
else{beep(false);m.className="st bad";m.textContent=data.error==="not_on_route"?"This student is not on this bus.":data.error==="no_trip"?"Start the trip first.":"Could not note this student."}}
catch(e){beep(false);m.className="st bad";m.textContent="No internet. Try again."}}
function code(t){const m=/^SES\|(.{1,40})$/.exec(String(t||"").trim());return m?m[1]:null}
function stopCam(){if(raf)cancelAnimationFrame(raf);raf=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$("vid").hidden=true;$("cam").textContent="Start scanner / स्कॅनर सुरू करा"}
function loop(){const v=$("vid"),c=$("cv");if(!stream)return;if(v.readyState===v.HAVE_ENOUGH_DATA&&jq){c.width=v.videoWidth;c.height=v.videoHeight;const g=c.getContext("2d",{willReadFrequently:true});g.drawImage(v,0,0);const r=jq(g.getImageData(0,0,c.width,c.height).data,c.width,c.height),a=r&&code(r.data);if(a&&(a!==lastCode||Date.now()-lastAt>4000)){lastCode=a;lastAt=Date.now();board(a)}}setTimeout(()=>{raf=requestAnimationFrame(loop)},150)}
$("cam").onclick=async()=>{if(stream)return stopCam();try{if(!jq){await new Promise((ok,no)=>{const sc=document.createElement("script");sc.src="js/vendor/jsQR.js";sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});jq=window.jsQR}
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});const v=$("vid");v.srcObject=stream;v.hidden=false;await v.play();$("cam").textContent="Stop scanner / स्कॅनर बंद करा";loop()}catch(e){stream=null;const m=$("bmsg");m.hidden=false;m.className="st bad";m.textContent="Camera did not start. Allow camera, or type the admission number."}};
$("manb").onclick=()=>{const v=$("man").value.trim();if(v){board(v);$("man").value=""}};
})();
</script></body></html>
