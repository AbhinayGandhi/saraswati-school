<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Teacher attendance | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">Teacher attendance</h1><div class="row"><div><label for="dt">Date</label><input id="dt" type="date"></div><button class="btn ghost" id="ap">Mark all present</button><button class="btn" id="sv">Save attendance</button></div><div id="note" role="status"></div><div id="list" class="tw"></div>
<h2 style="margin-top:2rem">Monthly report</h2><div class="row noprint"><div><label for="mo">Month</label><input id="mo" type="month"></div><button class="btn ghost" id="rp">Show report</button><button class="btn ghost" id="rx">Export CSV</button><button class="btn ghost" onclick="window.print()">Print</button></div><div id="rep" class="tw"></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script><script src="js/exams.js"></script><script src="js/fees.js"></script>
<script>
(async()=>{const p=await Auth.require([...ADMIN_ROLES,"reception"]);Auth.shell(p);const $=id=>document.getElementById(id);

const ST=[["present","Present"],["absent","Absent"],["late","Late"],["half_day","Half day"],["leave","Leave"]],list=$("list"),canSave=["super_admin","school_admin","reception"].includes(p.role);let ts=[],rep=[];$("dt").value=Fee.today();$("mo").value=Fee.today().slice(0,7);$("sv").hidden=!canSave;$("ap").hidden=!canSave;
async function sheet(){const dt=$("dt").value;$("note").innerHTML="";if(!dt)return;list.innerHTML='<div class="state">Loading...</div>';
try{const [t,a,h,lv]=await Promise.all([db.from("teachers").select("id,name,employee_id").eq("status","active").order("name"),db.from("teacher_attendance").select("teacher_id,status").eq("att_date",dt),db.from("school_calendar").select("title").eq("day",dt).in("kind",["holiday","vacation"]),db.from("leave_requests").select("teacher_id").eq("status","approved").lte("start_date",dt).gte("end_date",dt)]);
if(t.error||a.error||h.error||lv.error)throw t.error||a.error||h.error||lv.error;ts=t.data;if(!ts.length)return U.state(list,"empty","No active teachers. Add teachers first.");
const m=Object.fromEntries(a.data.map(x=>[x.teacher_id,x.status])),onLeave=new Set(lv.data.map(x=>x.teacher_id)),hol=h.data[0];
if(hol)$("note").innerHTML=`<div class="state error">${U.esc(hol.title)}: this day is a holiday. Attendance cannot be marked.</div>`;else if(new Date(dt+"T00:00").getDay()===0)$("note").innerHTML='<div class="state">This date is a Sunday.</div>';
$("sv").disabled=!!hol;
list.innerHTML="<table><thead><tr><th>ID</th><th>Teacher</th><th>Status</th></tr></thead><tbody>"+ts.map(x=>{const cur=m[x.id]||(onLeave.has(x.id)?"leave":"present");return `<tr><td>${U.esc(x.employee_id)}</td><td>${U.esc(x.name)}${onLeave.has(x.id)?" <small>(approved leave)</small>":""}</td><td><select data-t="${x.id}" ${canSave?"":"disabled"} aria-label="Status for ${U.esc(x.name)}">${ST.map(s=>`<option value="${s[0]}"${cur===s[0]?" selected":""}>${s[1]}</option>`).join("")}</select></td></tr>`}).join("")+"</tbody></table>"}
catch(e){U.friendly(e);U.state(list,"error","Unable to load teacher attendance. Please try again.")}}
$("ap").onclick=()=>list.querySelectorAll("select[data-t]").forEach(s=>s.value="present");
$("sv").onclick=async()=>{const rows=[...list.querySelectorAll("select[data-t]")].map(s=>({teacher_id:s.dataset.t,att_date:$("dt").value,status:s.value}));if(!rows.length)return;$("sv").disabled=true;
const {error}=await db.from("teacher_attendance").upsert(rows,{onConflict:"teacher_id,att_date"});$("sv").disabled=false;if(error){U.friendly(error);return U.toast(String(error.message).includes("holiday")?"This date is a holiday.":"Could not save attendance. Please try again.","err")}U.audit("Teacher attendance saved ("+rows.length+")","teacher_attendance",$("dt").value);U.toast("Attendance saved.")};
$("dt").onchange=sheet;
$("rp").onclick=async()=>{const mo=$("mo").value;if(!mo)return;const [y,m]=mo.split("-"),last=new Date(y,m,0).getDate();
try{const [t,a]=await Promise.all([db.from("teachers").select("id,name,employee_id").order("name"),db.from("teacher_attendance").select("teacher_id,status").gte("att_date",mo+"-01").lte("att_date",mo+"-"+String(last).padStart(2,"0"))]);if(t.error||a.error)throw t.error||a.error;
if(!a.data.length)return U.state($("rep"),"empty","No attendance marked for this month.");
rep=t.data.map(x=>{const r=a.data.filter(i=>i.teacher_id===x.id),c=s=>r.filter(i=>i.status===s).length,att=c("present")+c("late")+c("half_day")*0.5;return [x.employee_id,x.name,c("present"),c("absent"),c("late"),c("half_day"),c("leave"),r.length?Math.round(att/r.length*100)+"%":"-"]}).filter(r=>r[2]+r[3]+r[4]+r[5]+r[6]>0);
$("rep").innerHTML="<table><thead><tr><th>ID</th><th>Teacher</th><th>Present</th><th>Absent</th><th>Late</th><th>Half day</th><th>Leave</th><th>Attendance %</th></tr></thead><tbody>"+rep.map(r=>"<tr>"+r.map(v=>`<td>${U.esc(v)}</td>`).join("")+"</tr>").join("")+"</tbody></table>"}catch(e){U.friendly(e);U.state($("rep"),"error","Unable to load the report. Please try again.")}};
$("rx").onclick=()=>rep.length?Students.download("teacher-attendance-"+$("mo").value+".csv",Students.csv([["employee_id","teacher","present","absent","late","half_day","leave","percent"],...rep])):U.toast("Show the report first.","err");sheet();
})();
</script></body></html>
