<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Transport | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">Transport</h1><form id="rf" class="panel row" hidden><h3 style="grid-column:1/-1">Add route</h3><div><label for="rn">Route name</label><input id="rn" required maxlength="80"></div><div><label for="rv">Vehicle number</label><input id="rv" maxlength="30"></div><div><label for="rd">Driver name</label><input id="rd" maxlength="80"></div><div><label for="rc">Driver contact</label><input id="rc" type="tel" maxlength="15"></div><div><label for="rp">Pickup time</label><input id="rp" type="time"></div><div><label for="rt">Drop time</label><input id="rt" type="time"></div><button class="btn">Add route</button></form>
<h2>Routes and stops</h2><div id="routes"></div>
<form id="af" class="panel row" hidden><h3 style="grid-column:1/-1">Assign a student to a route</h3><div><label for="y">Academic year</label><select id="y"></select></div><div><label for="dv">Division</label><select id="dv"></select></div><div><label for="st">Student</label><select id="st"></select></div><div><label for="ar">Route</label><select id="ar"></select></div><div><label for="as">Stop</label><select id="as"></select></div><div><label for="ad">Start date</label><input id="ad" type="date" required></div><button class="btn">Assign</button></form>
<h2>Transport report</h2><div class="row noprint"><div><label for="fr">Route</label><select id="fr"></select></div><button class="btn ghost" id="ex">Export CSV</button><button class="btn ghost" onclick="window.print()">Print</button></div><div id="rep" class="tw"></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script><script src="js/exams.js"></script><script src="js/fees.js"></script>
<script>
(async()=>{const p=await Auth.require([...ADMIN_ROLES,"reception"]);Auth.shell(p);const $=id=>document.getElementById(id);

const canEdit=["super_admin","school_admin","reception"].includes(p.role),T=v=>String(v||"").slice(0,5);let routes=[],cls=[],csv=[];$("rf").hidden=!canEdit;$("af").hidden=!canEdit;$("ad").value=Fee.today();
async function loadRoutes(){try{const {data,error}=await db.from("transport_routes").select("*,transport_stops(id,name,stop_order)").order("name");if(error)throw error;routes=data;
$("routes").innerHTML=data.length?data.map(r=>{const s=[...r.transport_stops].sort((a,b)=>a.stop_order-b.stop_order);return `<div class="card" style="margin-bottom:.8rem"><h3>${U.esc(r.name)} <span class="badge ${r.status==="active"?"on":""}">${r.status}</span></h3><p>Vehicle: ${U.esc(r.vehicle_no||"-")} | Driver: ${U.esc(r.driver_name||"-")} ${U.esc(r.driver_contact||"")} | Pickup ${T(r.pickup_time)||"-"} | Drop ${T(r.drop_time)||"-"}</p><p>Stops: ${s.length?s.map(x=>U.esc(x.stop_order+". "+x.name)).join(", "):"none yet"}</p>${canEdit?`<div class="row"><div><label>New stop</label><input class="sn" maxlength="80"></div><div><label>Order</label><input class="so" type="number" min="1" value="${s.length+1}"></div><button class="btn sm" data-s="${r.id}">Add stop</button><button class="btn sm ghost" data-t="${r.id}">${r.status==="active"?"Deactivate":"Activate"}</button></div>`:""}</div>`}).join(""):"<div class=\"state\">No routes yet.</div>";
const o=data.filter(r=>r.status==="active").map(r=>`<option value="${r.id}">${U.esc(r.name)}</option>`).join("");$("ar").innerHTML=o;$("fr").innerHTML='<option value="">All routes</option>'+data.map(r=>`<option value="${r.id}">${U.esc(r.name)}</option>`).join("");fillStops();report()}catch(e){U.friendly(e);U.state($("routes"),"error","Unable to load routes. Please try again.")}}
function fillStops(){const r=routes.find(x=>x.id===$("ar").value);$("as").innerHTML=r?[...r.transport_stops].sort((a,b)=>a.stop_order-b.stop_order).map(s=>`<option value="${s.id}">${U.esc(s.name)}</option>`).join(""):""}
$("routes").addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;
if(b.dataset.s){const c=b.closest(".card"),n=c.querySelector(".sn").value.trim();if(!n)return U.toast("Enter a stop name.","err");const {error}=await db.from("transport_stops").insert({route_id:b.dataset.s,name:n,stop_order:Number(c.querySelector(".so").value)||1});if(error){U.friendly(error);return U.toast(error.code==="23505"?"This stop already exists on the route.":"Could not add the stop.","err")}U.audit("Stop added","transport_stops",b.dataset.s);loadRoutes()}
else if(b.dataset.t){const r=routes.find(x=>x.id===b.dataset.t);if(!await U.confirm((r.status==="active"?"Deactivate":"Activate")+" this route?"))return;const {error}=await db.from("transport_routes").update({status:r.status==="active"?"inactive":"active"}).eq("id",r.id);if(error){U.friendly(error);return U.toast("Could not save.","err")}U.audit("Route status changed","transport_routes",r.id);loadRoutes()}});
$("rf").addEventListener("submit",async ev=>{ev.preventDefault();const v=i=>$(i).value.trim()||null,{data,error}=await db.from("transport_routes").insert({name:v("rn"),vehicle_no:v("rv"),driver_name:v("rd"),driver_contact:v("rc"),pickup_time:$("rp").value||null,drop_time:$("rt").value||null}).select("id").single();
if(error){U.friendly(error);return U.toast(error.code==="23505"?"This route name already exists.":"Could not add the route.","err")}U.audit("Route created","transport_routes",data.id);ev.target.reset();loadRoutes()});
if(canEdit){try{const {data,error}=await db.from("classes").select("id,name,sort_order").order("sort_order");if(error)throw error;cls=data;await Ex.yearSelect($("y"));loadDivs()}catch(e){U.friendly(e)}}
async function loadDivs(){const {data,error}=await db.from("divisions").select("id,name,class_id").eq("academic_year_id",$("y").value);if(error){U.friendly(error);return}$("dv").innerHTML=data.map(x=>({...x,l:(cls.find(c=>c.id===x.class_id)?.name||"")+" - "+x.name,o:cls.findIndex(c=>c.id===x.class_id)})).sort((a,b)=>a.o-b.o||a.name.localeCompare(b.name)).map(x=>`<option value="${x.id}">${U.esc(x.l)}</option>`).join("");loadStu()}
async function loadStu(){if(!$("dv").value){$("st").innerHTML="";return}const {data,error}=await db.from("student_enrollments").select("id,roll_no,students!inner(first_name,last_name)").eq("division_id",$("dv").value).eq("academic_year_id",$("y").value).eq("status","active").order("roll_no",{nullsFirst:false});if(error){U.friendly(error);return}$("st").innerHTML=data.map(x=>`<option value="${x.id}">${U.esc((x.roll_no??"-")+" | "+x.students.first_name+" "+x.students.last_name)}</option>`).join("")}
$("y").onchange=loadDivs;$("dv").onchange=loadStu;$("ar").onchange=fillStops;$("fr").onchange=report;
$("af").addEventListener("submit",async ev=>{ev.preventDefault();if(!$("st").value||!$("ar").value)return U.toast("Choose a student and a route.","err");if(!await U.confirm("Assign this student to the route? Any current assignment will end today."))return;
const {error:e1}=await db.from("transport_assignments").update({status:"inactive",end_date:Fee.today()}).eq("enrollment_id",$("st").value).eq("status","active");if(e1){U.friendly(e1);return U.toast("Could not update the current assignment.","err")}
const {data,error}=await db.from("transport_assignments").insert({enrollment_id:$("st").value,route_id:$("ar").value,stop_id:$("as").value||null,start_date:$("ad").value}).select("id").single();if(error){U.friendly(error);return U.toast("Could not assign.","err")}
U.audit("Transport assigned","transport_assignments",data.id);U.toast("Assigned.");report()});
async function report(){try{let q=db.from("transport_assignments").select("start_date,route_id,transport_routes(name),transport_stops(name),student_enrollments(roll_no,students(first_name,last_name,admission_no),divisions(name,classes(name)))").eq("status","active").limit(2000);if($("fr").value)q=q.eq("route_id",$("fr").value);const {data,error}=await q;if(error)throw error;
csv=[["route","stop","student","admission_no","class","start_date"],...data.map(a=>[a.transport_routes.name,a.transport_stops?.name||"",a.student_enrollments.students.first_name+" "+a.student_enrollments.students.last_name,a.student_enrollments.students.admission_no,a.student_enrollments.divisions.classes.name+" - "+a.student_enrollments.divisions.name,a.start_date])];
$("rep").innerHTML=data.length?"<table><thead><tr>"+csv[0].map(h=>`<th>${h}</th>`).join("")+"</tr></thead><tbody>"+csv.slice(1).map(r=>"<tr>"+r.map(v=>`<td>${U.esc(v)}</td>`).join("")+"</tr>").join("")+"</tbody></table>":"<div class=\"state\">No students assigned.</div>"}catch(e){U.friendly(e);U.state($("rep"),"error","Unable to load the report. Please try again.")}}
$("ex").onclick=()=>csv.length>1?Students.download("transport-report.csv",Students.csv(csv)):U.toast("Nothing to export.","err");loadRoutes();
})();
</script></body></html>
