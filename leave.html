<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Staff leave | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">Staff leave</h1><form id="f" class="panel row"><h3 style="grid-column:1/-1">Apply for leave</h3><div id="ew"><label for="em">Employee</label><select id="em"></select></div><div><label for="lt">Leave type</label><select id="lt"><option value="casual">Casual</option><option value="sick">Sick</option><option value="earned">Earned</option><option value="maternity">Maternity</option><option value="unpaid">Unpaid</option><option value="other">Other</option></select></div><div><label for="sd">From</label><input id="sd" type="date" required></div><div><label for="ed">To</label><input id="ed" type="date" required></div><div style="grid-column:1/-1"><label for="rs">Reason</label><textarea id="rs" rows="2" maxlength="500"></textarea></div><button class="btn">Submit leave request</button></form>
<div class="row"><div><label for="fs">Status</label><select id="fs"><option value="">All</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="cancelled">Cancelled</option></select></div><div><label for="fd">From date</label><input id="fd" type="date"></div><div><label for="td">To date</label><input id="td" type="date"></div><button class="btn ghost" id="ex">Export CSV</button></div>
<div id="list" class="tw"></div><h2 style="margin-top:1.5rem">Approved leave summary (days)</h2><div id="sum" class="tw"></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script><script src="js/exams.js"></script><script src="js/fees.js"></script>
<script>
(async()=>{const p=await Auth.require([...ADMIN_ROLES,"teacher","class_teacher","accountant","librarian","reception"]);Auth.shell(p);const $=id=>document.getElementById(id);

const list=$("list"),adm=Perm.isAdmin(p.role),front=["super_admin","school_admin","principal","reception"].includes(p.role);let emps=[],rows=[];$("sd").value=$("ed").value=Fee.today();
try{const [t,s]=await Promise.all([db.from("teachers").select("id,name,employee_id,profile_id").eq("status","active").order("name"),front?db.from("staff").select("id,name,employee_id").eq("status","active").order("name"):Promise.resolve({data:[]})]);if(t.error||s.error)throw t.error||s.error;
emps=[...t.data.map(x=>({key:"t:"+x.id,label:x.name+" ("+x.employee_id+")"})),...s.data.map(x=>({key:"s:"+x.id,label:x.name+" ("+x.employee_id+", staff)"}))];
if(!front)emps=t.data.filter(x=>x.profile_id===p.id).map(x=>({key:"t:"+x.id,label:x.name}));
$("em").innerHTML=emps.map(e=>`<option value="${e.key}">${U.esc(e.label)}</option>`).join("");if(!emps.length){$("f").innerHTML="<p>Your login is not linked to an employee record yet. Ask the administrator to link it (Link logins to employees).</p>"}}catch(e){U.friendly(e)}
const days=l=>Math.round((new Date(l.end_date)-new Date(l.start_date))/864e5)+1;
async function load(){list.innerHTML='<div class="state">Loading...</div>';try{let q=db.from("leave_requests").select("*,teachers(name,employee_id),staff(name,employee_id)").order("start_date",{ascending:false}).limit(300);if($("fs").value)q=q.eq("status",$("fs").value);if($("fd").value)q=q.gte("end_date",$("fd").value);if($("td").value)q=q.lte("start_date",$("td").value);
const {data,error}=await q;if(error)throw error;rows=data.map(l=>({...l,who:(l.teachers||l.staff)?.name||"Employee",d:days(l)}));
if(!rows.length)U.state(list,"empty","No leave requests.");else list.innerHTML="<table><thead><tr><th>Employee</th><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>"+rows.map(l=>`<tr><td>${U.esc(l.who)}</td><td>${U.esc(l.leave_type)}</td><td>${U.esc(l.start_date)}</td><td>${U.esc(l.end_date)}</td><td>${l.d}</td><td>${U.esc(l.reason||"")}${l.remarks?`<br><small>Remarks: ${U.esc(l.remarks)}</small>`:""}</td><td><span class="badge ${l.status==="approved"?"on":""}">${U.esc(l.status)}</span></td><td>${l.status==="pending"?`${adm?`<button class="btn sm" data-a="${l.id}">Approve</button> <button class="btn sm ghost" data-r="${l.id}">Reject</button> `:""}<button class="btn sm ghost" data-c="${l.id}">Cancel</button>`:""}</td></tr>`).join("")+"</tbody></table>";
const m={};rows.filter(l=>l.status==="approved").forEach(l=>{const r=m[l.who]=m[l.who]||{};r[l.leave_type]=(r[l.leave_type]||0)+l.d});const T=["casual","sick","earned","maternity","unpaid","other"];
$("sum").innerHTML=Object.keys(m).length?"<table><thead><tr><th>Employee</th>"+T.map(t=>`<th>${t}</th>`).join("")+"<th>Total</th></tr></thead><tbody>"+Object.entries(m).map(([k,v])=>`<tr><td>${U.esc(k)}</td>${T.map(t=>`<td>${v[t]||0}</td>`).join("")}<td>${Object.values(v).reduce((a,b)=>a+b,0)}</td></tr>`).join("")+"</tbody></table>":"<p>No approved leave in this selection.</p>"}
catch(e){U.friendly(e);U.state(list,"error","Unable to load leave requests. Please try again.")}}
list.addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;const id=b.dataset.a||b.dataset.r||b.dataset.c,st=b.dataset.a?"approved":b.dataset.r?"rejected":"cancelled";let rem=null;
if(st!=="cancelled"){rem=prompt(st==="approved"?"Remarks (optional)":"Reason for rejection (optional)");if(rem===null)return}else if(!await U.confirm("Cancel this leave request?"))return;
const {error}=await db.rpc("set_leave_status",{p_id:id,p_status:st,p_remarks:rem&&rem.trim()?rem.trim():null});if(error){U.friendly(error);return U.toast("Could not update. It may already be decided.","err")}U.audit("Leave "+st,"leave_requests",id);U.toast("Saved.");load()});
["fs","fd","td"].forEach(i=>$(i).onchange=load);
$("f").addEventListener("submit",async ev=>{ev.preventDefault();if(!$("em")||!$("em").value)return U.toast("No employee selected.","err");if($("ed").value<$("sd").value)return U.toast("The end date cannot be before the start date.","err");
const [k,id]=$("em").value.split(":"),{data,error}=await db.from("leave_requests").insert({teacher_id:k==="t"?id:null,staff_id:k==="s"?id:null,leave_type:$("lt").value,start_date:$("sd").value,end_date:$("ed").value,reason:$("rs").value.trim()||null}).select("id").single();
if(error){U.friendly(error);return U.toast("Could not submit the request.","err")}U.audit("Leave requested","leave_requests",data.id);U.toast("Leave request submitted.");ev.target.reset();$("sd").value=$("ed").value=Fee.today();load()});
$("ex").onclick=()=>rows.length?Students.download("leave.csv",Students.csv([["employee","type","from","to","days","reason","status","remarks"],...rows.map(l=>[l.who,l.leave_type,l.start_date,l.end_date,l.d,l.reason,l.status,l.remarks])])):U.toast("Nothing to export.","err");load();
})();
</script></body></html>
