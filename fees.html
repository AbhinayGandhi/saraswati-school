<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Fees and payments | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">Fees and payments</h1><div id="cards" class="grid noprint"></div><div class="row" style="margin-top:1rem"><div><label for="y">Academic year</label><select id="y"></select></div><div><label for="d">Division</label><select id="d"></select></div><div><label for="st">Status</label><select id="st"><option value="">All</option><option value="pending">Pending</option><option value="partially_paid">Partially paid</option><option value="overdue">Overdue</option><option value="paid">Paid</option><option value="waived">Waived</option></select></div><div><label for="q">Search student</label><input id="q" type="search" placeholder="Name, admission no, GR no"></div></div>
<form id="pf" class="panel row" hidden><h3 id="pt" style="grid-column:1/-1"></h3><div><label for="pa">Amount</label><input id="pa" type="number" min="0.01" step="0.01" required></div><div><label for="pd">Payment date</label><input id="pd" type="date" required></div><div><label for="pm">Payment mode</label><select id="pm"><option value="cash">Cash</option><option value="upi">UPI</option><option value="bank_transfer">Bank transfer</option><option value="cheque">Cheque</option><option value="other">Other</option></select></div><div><label for="pr">Reference number</label><input id="pr" maxlength="60"></div><div><label for="pn">Notes</label><input id="pn" maxlength="200"></div><button class="btn">Record payment</button><button type="button" class="btn ghost" id="pc">Cancel</button></form>
<form id="cf" class="panel row" hidden><h3 id="ct" style="grid-column:1/-1"></h3><div><label for="ctp">Type</label><select id="ctp"><option value="fixed">Fixed amount</option><option value="percent">Percentage</option></select></div><div><label for="cv">Value</label><input id="cv" type="number" min="0.01" step="0.01" required></div><div><label for="cr">Reason</label><input id="cr" required maxlength="150"></div><div><label for="cn">Notes</label><input id="cn" maxlength="200"></div><button class="btn">Add concession</button><button type="button" class="btn ghost" id="cc">Cancel</button></form>
<div id="list" class="tw"></div><div class="pager"><button class="btn ghost sm" id="pv">Previous</button><span id="pg"></span><button class="btn ghost sm" id="nx">Next</button></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script><script src="js/exams.js"></script><script src="js/fees.js"></script>
<script>
(async()=>{const p=await Auth.require([...ADMIN_ROLES,"accountant"]);Auth.shell(p);const $=id=>document.getElementById(id);

const list=$("list"),canPay=Fee.MANAGE.includes(p.role),canConc=Fee.APPROVE.includes(p.role),PS=25;let page=0,rows=[],cur=null,cls=[];
const SEL="id,installment_no,assigned_amount,concession_amount,paid_amount,balance,due_date,status,fee_types(name),student_enrollments!inner(academic_year_id,division_id,divisions(name,classes(name)),students!inner(admission_no,first_name,last_name))";
try{const {data,error}=await db.from("classes").select("id,name,sort_order").order("sort_order");if(error)throw error;cls=data;await Ex.yearSelect($("y"))}catch(e){U.friendly(e);return U.state(list,"error","Unable to load. Please try again.")}
async function summary(){const {data,error}=await db.rpc("fee_summary",{p_year:$("y").value});if(error){U.friendly(error);$("cards").innerHTML="";return}const s=data[0]||{};
$("cards").innerHTML=[["Today collection",Fee.inr(s.today_collection)],["This month collection",Fee.inr(s.month_collection)],["Total outstanding",Fee.inr(s.outstanding)],["Students with pending fees",s.pending_students],["Partially paid students",s.partial_students],["Fully paid students",s.paid_students]].map(c=>`<div class="card"><b>${U.esc(c[1])}</b>${c[0]}</div>`).join("")}
async function loadDivs(){const {data,error}=await db.from("divisions").select("id,name,class_id").eq("academic_year_id",$("y").value);if(error){U.friendly(error);return}
const d=data.map(x=>({...x,l:(cls.find(c=>c.id===x.class_id)?.name||"")+" - "+x.name,o:cls.findIndex(c=>c.id===x.class_id)})).sort((a,b)=>a.o-b.o||a.name.localeCompare(b.name));$("d").innerHTML='<option value="">All divisions</option>'+d.map(x=>`<option value="${x.id}">${U.esc(x.l)}</option>`).join("")}
async function load(){list.innerHTML='<div class="state">Loading...</div>';try{let ids=null;const t=Students.safe($("q").value);
if(t){const {data,error}=await db.from("student_enrollments").select("id,students!inner(id)").eq("academic_year_id",$("y").value).or(`first_name.ilike.%${t}%,last_name.ilike.%${t}%,admission_no.ilike.%${t}%,gr_no.ilike.%${t}%`,{foreignTable:"students"}).limit(200);if(error)throw error;ids=data.map(x=>x.id);if(!ids.length){$("pg").textContent="0";return U.state(list,"empty","No matching students.")}}
let q=db.from("student_fees").select(SEL,{count:"exact"}).eq("student_enrollments.academic_year_id",$("y").value);if(ids)q=q.in("enrollment_id",ids);if($("d").value)q=q.eq("student_enrollments.division_id",$("d").value);
const st=$("st").value;if(st==="overdue")q=q.in("status",["pending","partially_paid"]).lt("due_date",Fee.today());else if(st)q=q.eq("status",st);
const {data,error,count}=await q.order("due_date").range(page*PS,page*PS+PS-1);if(error)throw error;rows=data;
$("pg").textContent=count?`${page*PS+1}-${Math.min(count,(page+1)*PS)} of ${count}`:"0";$("pv").disabled=page===0;$("nx").disabled=(page+1)*PS>=count;
if(!data.length)return U.state(list,"empty","No fees found. Define a fee structure and assign it to students first.");
list.innerHTML="<table><thead><tr><th>Student</th><th>Class</th><th>Fee</th><th>Due</th><th>Fee amount</th><th>Concession</th><th>Paid</th><th>Balance</th><th>Status</th><th></th></tr></thead><tbody>"+data.map(f=>{const e=f.student_enrollments,s=e.students,sx=Fee.status(f);return `<tr><td>${U.esc(Fee.name(s))}<br><small>${U.esc(s.admission_no)}</small></td><td>${U.esc(e.divisions.classes.name+" - "+e.divisions.name)}</td><td>${U.esc(f.fee_types.name)} #${f.installment_no}</td><td>${U.esc(f.due_date)}</td><td>${Fee.inr(f.assigned_amount)}</td><td>${Fee.inr(f.concession_amount)}</td><td>${Fee.inr(f.paid_amount)}</td><td>${Fee.inr(f.balance)}</td><td><span class="badge ${sx==="paid"?"on":""}">${U.esc(Fee.label(sx))}</span></td><td>${Number(f.balance)>0&&canPay?`<button class="btn sm" data-p="${f.id}">Pay</button> `:""}${Number(f.balance)>0&&canConc?`<button class="btn sm ghost" data-c="${f.id}">Concession</button>`:""}</td></tr>`}).join("")+"</tbody></table>"}
catch(e){U.friendly(e);U.state(list,"error","Unable to load fees. Please try again.")}}
const reload=()=>{page=0;load()};
list.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;cur=rows.find(x=>x.id===(b.dataset.p||b.dataset.c));if(!cur)return;const s=cur.student_enrollments.students,lbl=`${Fee.name(s)} | ${cur.fee_types.name} #${cur.installment_no} | Balance ${Fee.inr(cur.balance)}`;
$("pf").hidden=$("cf").hidden=true;if(b.dataset.p){$("pf").hidden=false;$("pt").textContent="Record payment: "+lbl;$("pa").max=cur.balance;$("pa").value=cur.balance;$("pd").value=Fee.today();$("pf").scrollIntoView()}else{$("cf").hidden=false;$("ct").textContent="Concession: "+lbl;$("cf").scrollIntoView()}});
$("pc").onclick=()=>$("pf").hidden=true;$("cc").onclick=()=>$("cf").hidden=true;
$("pf").addEventListener("submit",async ev=>{ev.preventDefault();const a=Number($("pa").value);if(!(a>0))return U.toast("Enter a valid amount.","err");if(a>Number(cur.balance))return U.toast("The amount is more than the balance due ("+Fee.inr(cur.balance)+").","err");
const mode=$("pm").value,ref=$("pr").value.trim();if(mode!=="cash"&&!ref)return U.toast("Enter a reference number for this payment mode.","err");
if(!await U.confirm(`Record ${Fee.inr(a)} by ${mode.replace("_"," ")}? Payments cannot be edited or deleted afterwards.`))return;
const {data,error}=await db.from("fee_payments").insert({student_fee_id:cur.id,amount:a,payment_date:$("pd").value,mode,reference_no:ref||null,notes:$("pn").value.trim()||null}).select("id").single();
if(error){U.friendly(error);return U.toast(Fee.err(error),"err")}U.audit("Fee payment recorded","fee_payments",data.id);location.href="receipt.html?id="+data.id});
$("cf").addEventListener("submit",async ev=>{ev.preventDefault();const v=Number($("cv").value);if(!(v>0))return U.toast("Enter a valid value.","err");
if(!await U.confirm("Add this concession? It cannot be removed afterwards."))return;
const {data,error}=await db.from("fee_concessions").insert({student_fee_id:cur.id,concession_type:$("ctp").value,value:v,reason:$("cr").value.trim(),notes:$("cn").value.trim()||null}).select("id").single();
if(error){U.friendly(error);return U.toast(Fee.err(error),"err")}U.audit("Fee concession added","fee_concessions",data.id);U.toast("Concession added.");$("cf").hidden=true;ev.target.reset();summary();load()});
$("y").onchange=async()=>{await loadDivs();summary();reload()};$("d").onchange=reload;$("st").onchange=reload;$("q").addEventListener("input",U.debounce(reload));$("pv").onclick=()=>{page--;load()};$("nx").onclick=()=>{page++;load()};
await loadDivs();summary();load();
})();
</script></body></html>
