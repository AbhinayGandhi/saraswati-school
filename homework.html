<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Homework | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">Homework</h1><div class="row"><div><label for="y">Academic year</label><select id="y"></select></div><div><label for="dv">Division</label><select id="dv"></select></div><div><label for="fs">Subject</label><select id="fs"></select></div><div><label for="fq">From date</label><input id="fq" type="date"></div></div>
<form id="f" class="panel row" hidden><h3 id="ft" style="grid-column:1/-1">Add homework</h3><div><label for="hs">Subject</label><select id="hs" required></select></div><div><label for="hd">Homework date</label><input id="hd" type="date" required></div><div><label for="hu">Due date</label><input id="hu" type="date" required></div><div><label for="ht">Title</label><input id="ht" required maxlength="120"></div><div style="grid-column:1/-1"><label for="hx">Description</label><textarea id="hx" rows="3" maxlength="2000"></textarea></div><div><label for="hf">Attachment (PDF, JPG or PNG, up to 5 MB)</label><input id="hf" type="file" accept=".pdf,.jpg,.jpeg,.png"></div><button class="btn" id="hb">Save homework</button><button type="button" class="btn ghost" id="hc" hidden>Cancel edit</button></form>
<div id="list" class="tw"></div><div class="pager"><button class="btn ghost sm" id="pv">Previous</button><span id="pg"></span><button class="btn ghost sm" id="nx">Next</button></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script><script src="js/exams.js"></script><script src="js/fees.js"></script>
<script>
(async()=>{const p=await Auth.require([...ADMIN_ROLES,"teacher","class_teacher","parent","student"]);Auth.shell(p);const $=id=>document.getElementById(id);

const list=$("list"),canWrite=["super_admin","school_admin","teacher","class_teacher"].includes(p.role),PS=20;let cls=[],divs=[],cs=[],rows=[],page=0,editId=null;
try{const {data,error}=await db.from("classes").select("id,name,sort_order").order("sort_order");if(error)throw error;cls=data;await Ex.yearSelect($("y"))}catch(e){U.friendly(e);return U.state(list,"error","Unable to load. Please try again.")}
async function loadYear(){try{const [d,c]=await Promise.all([db.from("divisions").select("id,name,class_id,class_teacher_id").eq("academic_year_id",$("y").value),db.from("class_subjects").select("division_id,subject_id,teacher_id,subjects(name,sort_order)").eq("academic_year_id",$("y").value)]);if(d.error||c.error)throw d.error||c.error;cs=c.data;
const mine=!Perm.isAdmin(p.role)&&canWrite;const ok=x=>!mine||x.class_teacher_id===p.id||cs.some(s=>s.division_id===x.id&&s.teacher_id===p.id);
divs=d.data.filter(x=>canWrite?ok(x):true).map(x=>({...x,l:(cls.find(c=>c.id===x.class_id)?.name||"")+" - "+x.name,o:cls.findIndex(c=>c.id===x.class_id)})).sort((a,b)=>a.o-b.o||a.name.localeCompare(b.name));
$("dv").innerHTML=(canWrite&&mine?"":'<option value="">All divisions</option>')+divs.map(x=>`<option value="${x.id}">${U.esc(x.l)}</option>`).join("");fillSubs();page=0;load()}catch(e){U.friendly(e);U.state(list,"error","Unable to load. Please try again.")}}
function subsFor(){const dv=$("dv").value,mine=!Perm.isAdmin(p.role)&&canWrite,seen=new Map();cs.filter(s=>(!dv||s.division_id===dv)&&(!mine||s.teacher_id===p.id)).forEach(s=>seen.set(s.subject_id,s.subjects));return [...seen].sort((a,b)=>a[1].sort_order-b[1].sort_order||a[1].name.localeCompare(b[1].name)).map(([id,s])=>[id,s.name])}
function fillSubs(){const a=subsFor();$("fs").innerHTML='<option value="">All subjects</option>'+a.map(x=>`<option value="${x[0]}">${U.esc(x[1])}</option>`).join("");$("hs").innerHTML=a.map(x=>`<option value="${x[0]}">${U.esc(x[1])}</option>`).join("");$("f").hidden=!canWrite||!$("dv").value||!a.length}
async function load(){list.innerHTML='<div class="state">Loading...</div>';try{let q=db.from("homework").select("id,division_id,subject_id,homework_date,due_date,title,description,attachment_path,status,divisions(name,classes(name)),subjects(name)",{count:"exact"}).eq("academic_year_id",$("y").value);
if($("dv").value)q=q.eq("division_id",$("dv").value);if($("fs").value)q=q.eq("subject_id",$("fs").value);if($("fq").value)q=q.gte("homework_date",$("fq").value);
const {data,error,count}=await q.order("homework_date",{ascending:false}).range(page*PS,page*PS+PS-1);if(error)throw error;rows=data;$("pg").textContent=count?`${page*PS+1}-${Math.min(count,(page+1)*PS)} of ${count}`:"0";$("pv").disabled=page===0;$("nx").disabled=(page+1)*PS>=count;
if(!data.length)return U.state(list,"empty","No homework found.");
list.innerHTML=data.map(h=>`<div class="card" style="margin-bottom:.8rem"><h3>${U.esc(h.title)}</h3><p><b>${U.esc(h.subjects.name)}</b> | ${U.esc(h.divisions.classes.name+" - "+h.divisions.name)} | Given ${U.esc(h.homework_date)} | Due ${U.esc(h.due_date)} ${h.status==="inactive"?'<span class="badge">inactive</span>':""}</p><p style="white-space:pre-wrap">${U.esc(h.description||"")}</p>${h.attachment_path?`<button class="btn sm ghost" data-o="${h.id}">Open attachment</button> `:""}${canWrite?`<button class="btn sm" data-e="${h.id}">Edit</button> <button class="btn sm ghost" data-t="${h.id}">${h.status==="active"?"Deactivate":"Activate"}</button>`:""}</div>`).join("")}
catch(e){U.friendly(e);U.state(list,"error","Unable to load homework. Please try again.")}}
list.addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;
if(b.dataset.o){const h=rows.find(x=>x.id===b.dataset.o),w=window.open("","_blank");const {data,error}=await db.storage.from("homework").createSignedUrl(h.attachment_path,300);if(error){w&&w.close();U.friendly(error);return U.toast("Could not open the file.","err")}w?w.location=data.signedUrl:location.href=data.signedUrl}
else if(b.dataset.e){const h=rows.find(x=>x.id===b.dataset.e);editId=h.id;$("dv").value=h.division_id;fillSubs();$("hs").value=h.subject_id;$("hd").value=h.homework_date;$("hu").value=h.due_date;$("ht").value=h.title;$("hx").value=h.description||"";$("ft").textContent="Edit homework";$("hc").hidden=false;$("f").hidden=false;$("f").scrollIntoView()}
else if(b.dataset.t){const h=rows.find(x=>x.id===b.dataset.t),to=h.status==="active"?"inactive":"active";if(!await U.confirm("Mark this homework as "+to+"?"))return;const {error}=await db.from("homework").update({status:to}).eq("id",h.id);if(error){U.friendly(error);return U.toast("Could not save the change.","err")}U.audit("Homework "+to,"homework",h.id);load()}});
$("hc").onclick=()=>{editId=null;$("f").reset();$("ft").textContent="Add homework";$("hc").hidden=true};
$("f").addEventListener("submit",async ev=>{ev.preventDefault();const f=$("hf").files[0];if($("hu").value<$("hd").value)return U.toast("Due date cannot be before the homework date.","err");
if(f&&(f.size>5242880||!["application/pdf","image/jpeg","image/png"].includes(f.type)))return U.toast("Attachment must be a PDF, JPG or PNG up to 5 MB.","err");$("hb").disabled=true;
try{const row={academic_year_id:$("y").value,division_id:$("dv").value,subject_id:$("hs").value,homework_date:$("hd").value,due_date:$("hu").value,title:$("ht").value.trim(),description:$("hx").value.trim()||null};
if(f){const path=`${row.division_id}/${crypto.randomUUID()}-${f.name.replace(/[^A-Za-z0-9._-]/g,"_")}`;const {error:ue}=await db.storage.from("homework").upload(path,f,{contentType:f.type,upsert:false});if(ue)throw ue;row.attachment_path=path}
const r=editId?await db.from("homework").update(row).eq("id",editId).select("id").single():await db.from("homework").insert(row).select("id").single();if(r.error)throw r.error;
U.audit(editId?"Homework updated":"Homework created","homework",r.data.id);U.toast("Saved.");editId=null;$("f").reset();$("ft").textContent="Add homework";$("hc").hidden=true;load()}
catch(e){U.friendly(e);U.toast("Could not save the homework. You may not be assigned to this subject.","err")}$("hb").disabled=false});
$("y").onchange=loadYear;$("dv").onchange=()=>{fillSubs();page=0;load()};$("fs").onchange=()=>{page=0;load()};$("fq").onchange=()=>{page=0;load()};$("pv").onclick=()=>{page--;load()};$("nx").onclick=()=>{page++;load()};
$("hd").value=Fee.today();await loadYear();
})();
</script></body></html>
