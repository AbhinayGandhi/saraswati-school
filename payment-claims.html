<!doctype html><html lang="en"><head><meta name="description" content="Saraswati English Medium School: school management portal."><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>UPI payment claims | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">UPI payment claims</h1>
<p class="noprint">Parents report a UPI payment with its reference number. Check it in your bank or UPI app, then approve (a receipt is made) or reject.</p>
<div class="row noprint"><div><label for="fs">Show</label><select id="fs"><option value="pending">Waiting for verification</option><option value="">All</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></div></div>
<div id="list" class="tw"><div class="state">Loading...</div></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/fees.js"></script>
<script>

(async()=>{const p=await Auth.require([...ADMIN_ROLES,"accountant"]);Auth.shell(p);const $=id=>document.getElementById(id),can=["super_admin","school_admin","accountant"].includes(p.role);let rows=[];
const nm=s=>[s.first_name,s.middle_name,s.last_name].filter(Boolean).join(" ");
async function load(){const L=$("list");L.innerHTML='<div class="state">Loading...</div>';try{let q=db.from("payment_claims").select("id,amount,paid_on,upi_ref,note,status,review_note,receipt_no,created_at,student_enrollments(divisions(name,classes(name)),students(admission_no,first_name,middle_name,last_name))").order("created_at",{ascending:false}).limit(200);if($("fs").value)q=q.eq("status",$("fs").value);
const {data,error}=await q;if(error)throw error;rows=data;if(!rows.length)return U.state(L,"empty","No claims.");
L.innerHTML=`<table><thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Amount</th><th>Reference</th><th>Note</th><th>Status</th><th></th></tr></thead><tbody>${rows.map((c,i)=>{const e=c.student_enrollments,s=e.students;return `<tr><td>${U.esc(c.paid_on)}</td><td>${U.esc(nm(s))}<br><small>${U.esc(s.admission_no)}</small></td><td>${U.esc(e.divisions.classes.name+" - "+e.divisions.name)}</td><td>${Fee.inr(c.amount)}</td><td>${U.esc(c.upi_ref)}</td><td>${U.esc(c.note||"")}</td><td>${c.status==="pending"?"Waiting":c.status==="approved"?`Approved${c.receipt_no?` (<a href="receipt.html?no=${encodeURIComponent(c.receipt_no)}">${U.esc(c.receipt_no)}</a>)`:""}`:`Rejected${c.review_note?": "+U.esc(c.review_note):""}`}</td><td>${c.status==="pending"&&can?`<button class="btn sm" data-a="${i}">Approve</button> <button class="btn sm ghost" data-r="${i}">Reject</button>`:""}</td></tr>`}).join("")}</tbody></table>`}catch(e){U.friendly(e);U.state(L,"error","Unable to load. Please try again.")}}
$("list").addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;const ap=b.dataset.a!==undefined,c=rows[ap?b.dataset.a:b.dataset.r];let note=null;
if(ap){if(!await U.confirm("Approve Rs. "+Number(c.amount).toFixed(2)+" with reference "+c.upi_ref+"? Check that the money reached your account. A receipt will be made."))return}else{note=prompt("Reason for rejecting (the parent will see it)");if(note===null)return}
b.disabled=true;const {error}=await db.rpc("review_payment_claim",{p_id:c.id,p_approve:ap,p_note:note&&note.trim()?note.trim():null});
if(error){U.friendly(error);U.toast(/exceeds/.test(error.message||"")?"The amount is now more than the fee balance. Reject it or record the payment by hand.":/already/.test(error.message||"")?"This claim was already decided.":"Could not save.","err");b.disabled=false;return}
U.toast(ap?"Approved and receipt made.":"Rejected.");load()});
$("fs").onchange=load;load()})();
</script><script src="js/i18n.js"></script></body></html>
