<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Achievements | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">Achievements</h1><form id="f" class="panel row"><h3 style="grid-column:1/-1">Record an achievement (an admin must approve it)</h3><div><label for="st">For</label><select id="st"><option value="student">Student</option><option value="teacher">Teacher</option></select></div><div id="yw"><label for="y">Academic year</label><select id="y"></select></div><div id="dw"><label for="dv">Division</label><select id="dv"></select></div><div id="sw"><label for="sd">Student</label><select id="sd"></select></div><div id="tw" hidden><label for="tc">Teacher</label><select id="tc"></select></div><div><label for="ck">Category</label><select id="ck"></select></div><div><label for="ct">Title</label><input id="ct" required maxlength="150"></div><div><label for="cd">Date</label><input id="cd" type="date" required></div><div><label for="ce">Competition or event</label><input id="ce" maxlength="150"></div><div><label for="cp">Position or award</label><input id="cp" maxlength="80"></div><div style="grid-column:1/-1"><label for="cx">Description</label><textarea id="cx" rows="2" maxlength="1000"></textarea></div><div><label for="cf">Certificate or image (PDF, JPG, PNG, 5 MB)</label><input id="cf" type="file" accept=".pdf,.jpg,.jpeg,.png"></div><div><label><input type="checkbox" id="cpub"> Suggest for the public website (student shown as first name and last initial)</label></div><button class="btn" id="cb">Save</button></form>
<div class="row"><div><label for="fs">Show</label><select id="fs"><option value="">All</option><option value="pending">Pending approval</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></div></div><div id="list"></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script><script src="js/exams.js"></script><script src="js/fees.js"></script><script src="js/gallery.js"></script>
<script>
(async()=>{const p=await Auth.require([...ADMIN_ROLES,"reception","teacher","class_teacher"]);Auth.shell(p);const $=id=>document.getElementById(id);

const list=$("list"),isAdm=Perm.isAdmin(p.role),CATS=["Sports","Cultural","Academic","Drawing","Music","Dance","Science","Quiz","Competition","Community Service","Other"];let cls=[],rows=[];
$("ck").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");$("cd").value=Fee.today();
try{const [c,t]=await Promise.all([db.from("classes").select("id,name,sort_order").order("sort_order"),db.from("teacher_names").select("id,full_name").order("full_name")]);if(c.error||t.error)throw c.error||t.error;cls=c.data;$("tc").innerHTML=t.data.map(x=>`<option value="${x.id}">${U.esc(x.full_name||"Teacher")}</option>`).join("");await Ex.yearSelect($("y"))}catch(e){U.friendly(e);return U.state(list,"error","Unable to load. Please try again.")}
async function loadDivs(){const {data,error}=await db.from("divisions").select("id,name,class_id").eq("academic_year_id",$("y").value);if(error){U.friendly(error);return}
const d=data.map(x=>({...x,l:(cls.find(c=>c.id===x.class_id)?.name||"")+" - "+x.name,o:cls.findIndex(c=>c.id===x.class_id)})).sort((a,b)=>a.o-b.o||a.name.localeCompare(b.name));$("dv").innerHTML=d.map(x=>`<option value="${x.id}">${U.esc(x.l)}</option>`).join("");loadStudents()}
async function loadStudents(){if(!$("dv").value){$("sd").innerHTML="";return}const {data,error}=await db.from("student_enrollments").select("id,roll_no,students!inner(first_name,last_name)").eq("division_id",$("dv").value).eq("academic_year_id",$("y").value).eq("status","active").order("roll_no",{nullsFirst:false});
if(error){U.friendly(error);$("sd").innerHTML="";return}$("sd").innerHTML=data.map(x=>`<option value="${x.id}">${U.esc((x.roll_no??"-")+" | "+x.students.first_name+" "+x.students.last_name)}</option>`).join("")}
function who(a){if(a.subject_type==="teacher")return "Teacher";const e=a.student_enrollments;return e?e.students.first_name+" "+e.students.last_name+" ("+e.divisions.classes.name+" - "+e.divisions.name+")":"Student"}
async function load(){list.innerHTML='<div class="state">Loading...</div>';try{let q=db.from("achievements").select("*,student_enrollments(students(first_name,last_name),divisions(name,classes(name)))").order("achievement_date",{ascending:false}).limit(100);if($("fs").value)q=q.eq("approval_status",$("fs").value);
const {data,error}=await q;if(error)throw error;rows=data;if(!data.length)return U.state(list,"empty","No achievements found.");
list.innerHTML=data.map(a=>`<div class="card" style="margin-bottom:.8rem"><h3>${U.esc(a.title)} <span class="badge ${a.approval_status==="approved"?"on":""}">${U.esc(a.approval_status)}</span>${a.is_public?' <span class="badge">public</span>':""}</h3><p>${U.esc(who(a))} | ${U.esc(a.category)} | ${U.esc(a.achievement_date)}${a.event_name?" | "+U.esc(a.event_name):""}${a.position?" | "+U.esc(a.position):""}</p><p style="white-space:pre-wrap">${U.esc(a.description||"")}</p>${a.certificate_path?`<button class="btn sm ghost" data-o="${a.id}">Open certificate</button> `:""}${isAdm&&a.approval_status!=="approved"?`<button class="btn sm" data-a="${a.id}">Approve</button> `:""}${isAdm&&a.approval_status==="pending"?`<button class="btn sm ghost" data-x="${a.id}">Reject</button>`:""}</div>`).join("")}
catch(e){U.friendly(e);U.state(list,"error","Unable to load achievements. Please try again.")}}
list.addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;const id=b.dataset.o||b.dataset.a||b.dataset.x,a=rows.find(x=>x.id===id);if(!a)return;
try{if(b.dataset.o)await Gal.open("achievements",a.certificate_path);else{const to=b.dataset.a?"approved":"rejected";if(!await U.confirm((to==="approved"?"Approve":"Reject")+" this achievement?"))return;const {error}=await db.from("achievements").update({approval_status:to}).eq("id",id);if(error)throw error;U.audit("Achievement "+to,"achievements",id);U.toast("Saved.");load()}}
catch(er){U.friendly(er);U.toast("Could not complete that. Please try again.","err")}});
$("st").onchange=()=>{const s=$("st").value==="student";["yw","dw","sw"].forEach(i=>$(i).hidden=!s);$("tw").hidden=s};$("y").onchange=loadDivs;$("dv").onchange=loadStudents;$("fs").onchange=load;
$("f").addEventListener("submit",async ev=>{ev.preventDefault();const s=$("st").value==="student",f=$("cf").files[0];if(s&&!$("sd").value)return U.toast("Choose a student.","err");
if(f&&(f.size>5242880||!["application/pdf","image/jpeg","image/png"].includes(f.type)))return U.toast("File must be a PDF, JPG or PNG up to 5 MB.","err");$("cb").disabled=true;
try{const row={subject_type:s?"student":"teacher",enrollment_id:s?$("sd").value:null,teacher_id:s?null:$("tc").value,category:$("ck").value,title:$("ct").value.trim(),description:$("cx").value.trim()||null,achievement_date:$("cd").value,event_name:$("ce").value.trim()||null,position:$("cp").value.trim()||null,is_public:$("cpub").checked,approval_status:isAdm?"approved":"pending"};
if(f){const path=`${crypto.randomUUID()}/${f.name.replace(/[^A-Za-z0-9._-]/g,"_")}`;const {error:ue}=await db.storage.from("achievements").upload(path,f,{contentType:f.type,upsert:false});if(ue)throw ue;row.certificate_path=path}
const {data,error}=await db.from("achievements").insert(row).select("id").single();if(error)throw error;U.audit("Achievement recorded","achievements",data.id);U.toast(isAdm?"Saved.":"Saved. An admin will review it.");ev.target.reset();$("cd").value=Fee.today();load()}
catch(e){U.friendly(e);U.toast("Could not save. Please check the details.","err")}$("cb").disabled=false});
await loadDivs();load();
})();
</script></body></html>
