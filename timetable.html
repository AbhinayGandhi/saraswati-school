<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Timetable | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">Timetable</h1><div class="row noprint"><div><label for="y">Academic year</label><select id="y"></select></div><div><label for="vm">View</label><select id="vm"><option value="class">Class timetable</option><option value="teacher">Teacher timetable</option></select></div><div id="cw"><label for="dv">Class and division</label><select id="dv"></select></div><div id="tw" hidden><label for="tv">Teacher</label><select id="tv"></select></div><button class="btn ghost" onclick="window.print()">Print</button></div>
<form id="f" class="panel row noprint" hidden><h3 style="grid-column:1/-1">Add period to the selected division</h3><div><label for="fd">Day</label><select id="fd"><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option></select></div><div><label for="fp">Period</label><input id="fp" type="number" min="1" max="12" required></div><div><label for="fs">Subject</label><select id="fs"></select></div><div><label for="ft">Teacher</label><select id="ft"></select></div><div><label for="fa">Start time</label><input id="fa" type="time" required></div><div><label for="fb">End time</label><input id="fb" type="time" required></div><div><label for="fr">Room</label><input id="fr" maxlength="30"></div><button class="btn">Add period</button></form>
<div id="list" class="tw"></div><div id="el" class="tw noprint" style="margin-top:1.5rem"></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script><script src="js/exams.js"></script><script src="js/fees.js"></script>
<script>
(async()=>{const p=await Auth.require([...ADMIN_ROLES,"teacher","class_teacher"]);Auth.shell(p);const $=id=>document.getElementById(id);

const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],list=$("list"),canEdit=Perm.isAdmin(p.role);let cls=[],subs=[],tn=[],divs=[],slots=[];$("f").hidden=!canEdit;
const T=v=>String(v||"").slice(0,5),opt=(a,sel)=>a.map(x=>`<option value="${x[0]}"${x[0]===sel?" selected":""}>${U.esc(x[1])}</option>`).join("");
try{const [c,s,t]=await Promise.all([db.from("classes").select("id,name,sort_order").order("sort_order"),db.from("subjects").select("id,name").eq("is_active",true).order("sort_order").order("name"),db.from("teacher_names").select("id,full_name").order("full_name")]);
if(c.error||s.error||t.error)throw c.error||s.error||t.error;cls=c.data;subs=s.data.map(x=>[x.id,x.name]);tn=t.data.map(x=>[x.id,x.full_name||"Teacher"]);await Ex.yearSelect($("y"));
$("fs").innerHTML=opt(subs);$("ft").innerHTML='<option value="">No teacher</option>'+opt(tn);$("tv").innerHTML=opt(tn,tn.find(x=>x[0]===p.id)?.[0]);
if(!Perm.isAdmin(p.role)&&tn.some(x=>x[0]===p.id)){$("vm").value="teacher";$("cw").hidden=false}}catch(e){U.friendly(e);return U.state(list,"error","Unable to load. Please try again.")}
async function loadDivs(){const {data,error}=await db.from("divisions").select("id,name,class_id").eq("academic_year_id",$("y").value);if(error){U.friendly(error);return}
divs=data.map(x=>({...x,l:(cls.find(c=>c.id===x.class_id)?.name||"")+" - "+x.name,o:cls.findIndex(c=>c.id===x.class_id)})).sort((a,b)=>a.o-b.o||a.name.localeCompare(b.name));$("dv").innerHTML=opt(divs.map(d=>[d.id,d.l]));mode()}
function mode(){const t=$("vm").value==="teacher";$("cw").hidden=t;$("tw").hidden=!t;$("f").hidden=!canEdit||t;load()}
async function load(){list.innerHTML='<div class="state">Loading...</div>';$("el").innerHTML="";const t=$("vm").value==="teacher";
try{let q=db.from("timetable_slots").select("id,day,period,subject_id,teacher_id,start_time,end_time,room,division_id,subjects(name)").eq("academic_year_id",$("y").value).eq("is_active",true);
q=t?q.eq("teacher_id",$("tv").value):q.eq("division_id",$("dv").value);const {data,error}=await q;if(error)throw error;slots=data;
if(!data.length)return U.state(list,"empty",t?"No periods for this teacher.":"No timetable for this division yet.");
const per=[...new Set(data.map(x=>x.period))].sort((a,b)=>a-b),dn=id=>divs.find(d=>d.id===id)?.l||"",tname=id=>tn.find(x=>x[0]===id)?.[1]||"";
list.innerHTML="<table><thead><tr><th>Period</th>"+DAYS.map(d=>`<th>${d}</th>`).join("")+"</tr></thead><tbody>"+per.map(n=>"<tr><th>"+n+"</th>"+DAYS.map((d,i)=>{const s=data.find(x=>x.period===n&&x.day===i+1);return s?`<td><b>${U.esc(s.subjects.name)}</b><br><small>${U.esc(t?dn(s.division_id):tname(s.teacher_id))}${s.room?" | Room "+U.esc(s.room):""}<br>${T(s.start_time)}-${T(s.end_time)}</small></td>`:"<td></td>"}).join("")+"</tr>").join("")+"</tbody></table>";
if(canEdit&&!t)$("el").innerHTML="<h3>Edit periods</h3><table><thead><tr><th>Day</th><th>Period</th><th>Subject</th><th>Teacher</th><th>Start</th><th>End</th><th>Room</th><th></th></tr></thead><tbody>"+[...data].sort((a,b)=>a.day-b.day||a.period-b.period).map(s=>`<tr data-id="${s.id}"><td><select class="d">${opt(DAYS.map((d,i)=>[String(i+1),d]),String(s.day))}</select></td><td><input class="p" type="number" min="1" max="12" value="${s.period}"></td><td><select class="s">${opt(subs,s.subject_id)}</select></td><td><select class="t"><option value="">No teacher</option>${opt(tn,s.teacher_id)}</select></td><td><input class="a" type="time" value="${T(s.start_time)}"></td><td><input class="b" type="time" value="${T(s.end_time)}"></td><td><input class="r" maxlength="30" value="${U.esc(s.room||"")}"></td><td><button class="btn sm" data-s="1">Save</button> <button class="btn sm ghost" data-x="1">Deactivate</button></td></tr>`).join("")+"</tbody></table>"}
catch(e){U.friendly(e);U.state(list,"error","Unable to load the timetable. Please try again.")}}
const terr=e=>{const m=String(e?.message||"");return m.includes("timetable_teacher_uq")?"This teacher already has a class in that period on that day.":m.includes("timetable_div_uq")?"This division already has a subject in that period on that day.":m.includes("check")?"End time must be after start time.":"Could not save. Please check the details."};
$("el").addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;const tr=b.closest("tr"),id=tr.dataset.id;let r;
if(b.dataset.s)r=await db.from("timetable_slots").update({day:Number(tr.querySelector(".d").value),period:Number(tr.querySelector(".p").value),subject_id:tr.querySelector(".s").value,teacher_id:tr.querySelector(".t").value||null,start_time:tr.querySelector(".a").value,end_time:tr.querySelector(".b").value,room:tr.querySelector(".r").value.trim()||null}).eq("id",id);
else{if(!await U.confirm("Deactivate this period?"))return;r=await db.from("timetable_slots").update({is_active:false}).eq("id",id)}
if(r.error){U.friendly(r.error);return U.toast(terr(r.error),"err")}U.audit("Timetable changed","timetable_slots",id);U.toast("Saved.");load()});
$("f").addEventListener("submit",async ev=>{ev.preventDefault();const {data,error}=await db.from("timetable_slots").insert({academic_year_id:$("y").value,division_id:$("dv").value,day:Number($("fd").value),period:Number($("fp").value),subject_id:$("fs").value,teacher_id:$("ft").value||null,start_time:$("fa").value,end_time:$("fb").value,room:$("fr").value.trim()||null}).select("id").single();
if(error){U.friendly(error);return U.toast(terr(error),"err")}U.audit("Timetable period added","timetable_slots",data.id);U.toast("Added.");load()});
$("y").onchange=loadDivs;$("vm").onchange=mode;$("dv").onchange=load;$("tv").onchange=load;await loadDivs();
})();
</script></body></html>
