<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Admission enquiries | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">Admission enquiries</h1><div class="row"><div><label for="fs">Status</label><select id="fs"><option value="">All</option><option value="new">New</option><option value="contacted">Contacted</option><option value="follow_up">Follow-up</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="admission_completed">Admission completed</option></select></div><div><label for="q">Search</label><input id="q" type="search" placeholder="Student, parent, mobile, application no"></div><button class="btn ghost" id="ex">Export CSV</button></div>
<form id="cf" class="panel row" hidden><h3 id="ct" style="grid-column:1/-1"></h3><div><label for="an">Admission number</label><input id="an" required maxlength="30"></div><div><label for="dv">Class and division (active year)</label><select id="dv" required></select></div><div><label for="rn">Roll number</label><input id="rn" type="number" min="1"></div><button class="btn">Create student</button><button type="button" class="btn ghost" id="cc">Cancel</button></form>
<div id="list"></div><div class="pager"><button class="btn ghost sm" id="pv">Previous</button><span id="pg"></span><button class="btn ghost sm" id="nx">Next</button></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script><script src="js/exams.js"></script><script src="js/fees.js"></script>
<script>
(async()=>{const p=await Auth.require([...ADMIN_ROLES,"reception"]);Auth.shell(p);const $=id=>document.getElementById(id);

const list=$("list"),canEdit=["super_admin","school_admin","reception","principal"].includes(p.role),canConv=["super_admin","school_admin","reception"].includes(p.role),PS=25,ST=["new","contacted","follow_up","approved","rejected","admission_completed"];let page=0,rows=[],cur=null;
async function load(){list.innerHTML='<div class="state">Loading...</div>';try{let q=db.from("admission_enquiries").select("*,classes:applying_class_id(name)",{count:"exact"});if($("fs").value)q=q.eq("status",$("fs").value);const t=Students.safe($("q").value);if(t)q=q.or(`student_name.ilike.%${t}%,parent_name.ilike.%${t}%,mobile.ilike.%${t}%,application_no.ilike.%${t}%`);
const {data,error,count}=await q.order("created_at",{ascending:false}).range(page*PS,page*PS+PS-1);if(error)throw error;rows=data;$("pg").textContent=count?`${page*PS+1}-${Math.min(count,(page+1)*PS)} of ${count}`:"0";$("pv").disabled=page===0;$("nx").disabled=(page+1)*PS>=count;
if(!data.length)return U.state(list,"empty","No enquiries found.");
list.innerHTML=data.map(a=>`<div class="card" style="margin-bottom:.8rem" data-id="${a.id}"><h3>${U.esc(a.student_name)} <span class="badge">${U.esc(a.application_no)}</span></h3><p>DOB ${U.esc(a.dob)} | ${U.esc(a.gender)} | Class: ${U.esc(a.classes?.name||"-")} | Received ${U.esc(a.created_at.slice(0,10))}</p><p>Parent: ${U.esc(a.parent_name)} | ${U.esc(a.mobile)}${a.email?" | "+U.esc(a.email):""}<br>${U.esc(a.address||"")}</p><p>Previous: ${U.esc(a.previous_school||"-")} ${U.esc(a.previous_class||"")}</p>${a.message?`<p style="white-space:pre-wrap">${U.esc(a.message)}</p>`:""}
${canEdit&&a.status!=="admission_completed"?`<div class="row"><div><label>Status</label><select class="st">${ST.filter(s=>s!=="admission_completed").map(s=>`<option value="${s}"${s===a.status?" selected":""}>${s.replace("_"," ")}</option>`).join("")}</select></div><div><label>Notes</label><input class="nt" maxlength="500" value="${U.esc(a.notes||"")}"></div><button class="btn sm" data-s="${a.id}">Save</button>${canConv&&a.status==="approved"?`<button class="btn sm ghost" data-c="${a.id}">Convert to student</button>`:""}</div>`:`<p><span class="badge on">${U.esc(a.status.replace("_"," "))}</span> ${a.student_id?`<a href="student-profile.html?id=${a.student_id}">Open student</a>`:""}</p>${a.notes?`<p>Notes: ${U.esc(a.notes)}</p>`:""}`}</div>`).join("")}catch(e){U.friendly(e);U.state(list,"error","Unable to load enquiries. Please try again.")}}
list.addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;
if(b.dataset.s){const c=b.closest(".card"),{error}=await db.from("admission_enquiries").update({status:c.querySelector(".st").value,notes:c.querySelector(".nt").value.trim()||null}).eq("id",b.dataset.s);if(error){U.friendly(error);return U.toast("Could not save.","err")}U.audit("Enquiry updated","admission_enquiries",b.dataset.s);U.toast("Saved.");load()}
else if(b.dataset.c){cur=rows.find(x=>x.id===b.dataset.c);$("ct").textContent="Create student from: "+cur.student_name;$("cf").hidden=false;$("cf").scrollIntoView()}});
$("cc").onclick=()=>$("cf").hidden=true;
$("cf").addEventListener("submit",async ev=>{ev.preventDefault();if(!await U.confirm("Create a student from this enquiry? This cannot be undone."))return;const {data,error}=await db.rpc("convert_enquiry",{p_id:cur.id,p_admission_no:$("an").value.trim(),p_division:$("dv").value,p_roll:$("rn").value?Number($("rn").value):null});
if(error){U.friendly(error);const m=String(error.message);return U.toast(error.code==="23505"||m.includes("students_admission_no")?"This admission number is already used.":m.includes("possible duplicate")?"A student with the same name and date of birth already exists. Check before creating.":"Could not create the student.","err")}
U.audit("Enquiry converted to student","admission_enquiries",cur.id);U.toast("Student created.");$("cf").hidden=true;ev.target.reset();load()});
$("ex").onclick=async()=>{try{const {data,error}=await db.from("admission_enquiries").select("application_no,student_name,dob,gender,parent_name,mobile,email,status,created_at,classes:applying_class_id(name)").order("created_at",{ascending:false}).limit(5000);if(error)throw error;Students.download("admission-enquiries.csv",Students.csv([["application_no","student","dob","gender","parent","mobile","email","status","received","class"],...data.map(a=>[a.application_no,a.student_name,a.dob,a.gender,a.parent_name,a.mobile,a.email,a.status,a.created_at.slice(0,10),a.classes?.name])]))}catch(e){U.friendly(e);U.toast("Could not export.","err")}};
$("fs").onchange=()=>{page=0;load()};$("q").addEventListener("input",U.debounce(()=>{page=0;load()}));$("pv").onclick=()=>{page--;load()};$("nx").onclick=()=>{page++;load()};
if(canConv){try{const [y,c]=await Promise.all([db.from("academic_years").select("id").eq("is_active",true).maybeSingle(),db.from("classes").select("id,name,sort_order").order("sort_order")]);if(y.error||c.error)throw y.error||c.error;
if(y.data){const {data,error}=await db.from("divisions").select("id,name,class_id").eq("academic_year_id",y.data.id);if(error)throw error;$("dv").innerHTML=data.map(x=>({...x,l:(c.data.find(k=>k.id===x.class_id)?.name||"")+" - "+x.name,o:c.data.findIndex(k=>k.id===x.class_id)})).sort((a,b)=>a.o-b.o||a.name.localeCompare(b.name)).map(x=>`<option value="${x.id}">${U.esc(x.l)}</option>`).join("")}}catch(e){U.friendly(e)}}load();
})();
</script></body></html>
