<!doctype html><html lang="en"><head><meta name="description" content="Saraswati English Medium School: school management portal."><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Teachers | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" aria-label="Sidebar"></aside>
<div><header class="top"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1>Teachers</h1><form id="f" class="row"></form><label for="q">Search</label><input id="q" type="search" placeholder="Name, subject, ID"><div id="list" class="tw"><div class="state">Loading...</div></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/photos.js"></script><script src="js/people.js"></script>
<script>
(async()=>{const p=await Auth.require(ADMIN_ROLES);Auth.shell(p);
People.init({photos:true,table:"teachers",label:"Teacher",cols:[["employee_id","Employee ID"],["name","Name"],["qualification","Qualification"],["subject","Subject"],["mobile","Mobile"],["is_public","On public website"]],fields:[{id:"employee_id",label:"Employee ID",required:1},{id:"name",label:"Name",required:1},{id:"qualification",label:"Qualification"},{id:"subject",label:"Subject"},{id:"mobile",label:"Mobile",type:"tel"},{id:"email",label:"Email",type:"email"},{id:"joining_date",label:"Joining date",type:"date"},{id:"is_public",label:"Show on public website",options:["false","true"]}]});
// Subject suggestions from the Subjects page (you can still type anything, e.g. "Maths, Science")
try{const {data}=await db.from("subjects").select("name").eq("is_active",true).order("name");const f=document.getElementById("subject");
if(f&&data&&data.length){const dl=document.createElement("datalist");dl.id="subjlist";dl.innerHTML=data.map(x=>`<option value="${U.esc(x.name)}">`).join("");document.body.appendChild(dl);f.setAttribute("list","subjlist");f.placeholder="Choose or type"}
else if(f){f.placeholder="Add subjects on the Subjects page first"}}catch(e){U.friendly(e)}
})();
</script><script src="js/i18n.js"></script></body></html>
