<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><title>Activities | Saraswati English Medium School</title></head>
<body><div class="app"><aside id="sidebar" class="noprint" aria-label="Sidebar"></aside>
<div><header class="top noprint"><button class="btn ghost" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></header>
<main><h1 class="noprint">Activities</h1><div class="row"><div><label for="y">Academic year</label><select id="y"></select></div></div><form id="f" class="panel row"><h3 style="grid-column:1/-1">Add activity</h3><div><label for="at">Activity</label><input id="at" required maxlength="150"></div><div><label for="ak">Category</label><select id="ak"></select></div><div><label for="ad">Date</label><input id="ad" type="date" required></div><div><label for="av">Class and division</label><select id="av"></select></div><div><label for="ar">Result</label><input id="ar" maxlength="150"></div><div><label for="am">Achievement</label><input id="am" maxlength="150"></div><div style="grid-column:1/-1"><label for="an">Notes</label><textarea id="an" rows="2" maxlength="1000"></textarea></div><button class="btn">Add activity</button></form>
<div id="list"></div><div id="pp" class="panel" hidden><h3 id="pt"></h3><div class="row"><div><label for="pd">Division</label><select id="pd"></select></div><div><label for="ps">Student</label><select id="ps"></select></div><div><label for="po">Position or result</label><input id="po" maxlength="60"></div><button class="btn" id="pa">Add participant</button><button class="btn ghost" id="pc">Close</button></div><div id="pl" class="tw"></div></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/permissions.js"></script><script src="js/auth.js"></script><script src="js/students.js"></script><script src="js/exams.js"></script><script src="js/fees.js"></script><script src="js/gallery.js"></script>
<script>
(async()=>{const p=await Auth.require([...ADMIN_ROLES,"teacher","class_teacher"]);Auth.shell(p);const $=id=>document.getElementById(id);

const list=$("list"),CATS=["Sports","Cultural","Academic","Drawing","Music","Dance","Science","Quiz","Competition","Community Service","Other"];let cls=[],divs=[],rows=[],cur=null;
$("ak").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");$("ad").value=Fee.today();
try{const {data,error}=await db.from("classes").select("id,name,sort_order").order("sort_order");if(error)throw error;cls=data;await Ex.yearSelect($("y"))}catch(e){U.friendly(e);return U.state(list,"error","Unable to load. Please try again.")}
async function loadDivs(){const {data,error}=await db.from("divisions").select("id,name,class_id").eq("academic_year_id",$("y").value);if(error){U.friendly(error);return}
divs=data.map(x=>({...x,l:(cls.find(c=>c.id===x.class_id)?.name||"")+" - "+x.name,o:cls.findIndex(c=>c.id===x.class_id)})).sort((a,b)=>a.o-b.o||a.name.localeCompare(b.name));
const o=divs.map(x=>`<option value="${x.id}">${U.esc(x.l)}</option>`).join("");$("av").innerHTML='<option value="">Whole school</option>'+o;$("pd").innerHTML=o;load()}
async function load(){list.innerHTML='<div class="state">Loading...</div>';try{const {data,error}=await db.from("activities").select("id,title,category,activity_date,result,achievement,notes,division_id,is_active,teacher_id,activity_participants(count)").eq("academic_year_id",$("y").value).order("activity_date",{ascending:false}).limit(100);if(error)throw error;rows=data;
if(!data.length)return U.state(list,"empty","No activities yet for this year.");
list.innerHTML=data.map(a=>`<div class="card" style="margin-bottom:.8rem"><h3>${U.esc(a.title)} ${a.is_active?"":'<span class="badge">inactive</span>'}</h3><p>${U.esc(a.category)} | ${U.esc(a.activity_date)} | ${U.esc(divs.find(d=>d.id===a.division_id)?.l||"Whole school")} | Participants: ${a.activity_participants[0]?.count||0}</p>${a.result?`<p><b>Result:</b> ${U.esc(a.result)}</p>`:""}${a.achievement?`<p><b>Achievement:</b> ${U.esc(a.achievement)}</p>`:""}${a.notes?`<p style="white-space:pre-wrap">${U.esc(a.notes)}</p>`:""}<button class="btn sm" data-p="${a.id}">Participants</button> <button class="btn sm ghost" data-t="${a.id}">${a.is_active?"Deactivate":"Activate"}</button></div>`).join("")}
catch(e){U.friendly(e);U.state(list,"error","Unable to load activities. Please try again.")}}
async function loadStudents(){const {data,error}=await db.from("student_enrollments").select("id,roll_no,students!inner(first_name,last_name)").eq("division_id",$("pd").value).eq("academic_year_id",$("y").value).eq("status","active").order("roll_no",{nullsFirst:false});
if(error){U.friendly(error);$("ps").innerHTML="";return}$("ps").innerHTML=data.map(x=>`<option value="${x.id}">${U.esc((x.roll_no??"-")+" | "+x.students.first_name+" "+x.students.last_name)}</option>`).join("")}
async function loadParts(){try{const {data,error}=await db.from("activity_participants").select("id,position,student_enrollments(roll_no,students(first_name,last_name),divisions(name,classes(name)))").eq("activity_id",cur.id);if(error)throw error;
$("pl").innerHTML=data.length?"<table><thead><tr><th>Student</th><th>Class</th><th>Position or result</th><th></th></tr></thead><tbody>"+data.map(x=>{const e=x.student_enrollments;return `<tr><td>${U.esc(e.students.first_name+" "+e.students.last_name)}</td><td>${U.esc(e.divisions.classes.name+" - "+e.divisions.name)}</td><td>${U.esc(x.position||"")}</td><td><button class="btn sm ghost" data-r="${x.id}">Remove</button></td></tr>`}).join("")+"</tbody></table>":"<p>No participants yet.</p>"}catch(e){U.friendly(e);U.state($("pl"),"error","Unable to load participants.")}}
list.addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;
if(b.dataset.p){cur=rows.find(x=>x.id===b.dataset.p);$("pt").textContent="Participants: "+cur.title;if(cur.division_id)$("pd").value=cur.division_id;$("pp").hidden=false;await loadStudents();loadParts();$("pp").scrollIntoView()}
else if(b.dataset.t){const a=rows.find(x=>x.id===b.dataset.t);const {error}=await db.from("activities").update({is_active:!a.is_active}).eq("id",a.id);if(error){U.friendly(error);return U.toast("Could not save. Only the owner or an admin can change this.","err")}U.audit("Activity status changed","activities",a.id);load()}});
$("pl").addEventListener("click",async ev=>{const b=ev.target.closest("button[data-r]");if(!b||!await U.confirm("Remove this participant?"))return;const {error}=await db.from("activity_participants").delete().eq("id",b.dataset.r);if(error){U.friendly(error);return U.toast("Could not remove.","err")}loadParts();load()});
$("pd").onchange=loadStudents;$("pc").onclick=()=>$("pp").hidden=true;
$("pa").onclick=async()=>{if(!$("ps").value)return U.toast("Choose a student.","err");const {error}=await db.from("activity_participants").insert({activity_id:cur.id,enrollment_id:$("ps").value,position:$("po").value.trim()||null});
if(error){U.friendly(error);return U.toast(error.code==="23505"?"This student is already added.":"Could not add. Only the owner or an admin can add participants.","err")}U.audit("Participant added","activity_participants",cur.id);$("po").value="";loadParts();load()};
$("y").onchange=loadDivs;
$("f").addEventListener("submit",async ev=>{ev.preventDefault();const {data,error}=await db.from("activities").insert({academic_year_id:$("y").value,title:$("at").value.trim(),category:$("ak").value,activity_date:$("ad").value,division_id:$("av").value||null,result:$("ar").value.trim()||null,achievement:$("am").value.trim()||null,notes:$("an").value.trim()||null}).select("id").single();
if(error){U.friendly(error);return U.toast("Could not add the activity.","err")}U.audit("Activity created","activities",data.id);U.toast("Added.");ev.target.reset();$("ad").value=Fee.today();load()});
await loadDivs();
})();
</script></body></html>
